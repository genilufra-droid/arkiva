<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkiva · Protokolli dhe dosjet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="pdf-lib.min.js"></script>
<style>
:root{--red:#b3141b;--red2:#8a0d13;--red3:#d8232a;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--bg:#f5f5f7;--ok:#1f7a3d;--okbg:#e6f4ea;--warn:#8a5a00;--warnbg:#fff4df;--bad:#a4161a;--badbg:#fdeaea}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Inter,system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
a{color:var(--red);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit}

/* header */
.top{background:linear-gradient(90deg,#7a0a10,#b3141b 50%,#c51d24);color:#fff;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px}
.seal{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;font-size:12px}
.top .brand{font-weight:700;font-size:15px;line-height:1.2}
.top .brand small{display:block;font-weight:400;opacity:.85;font-size:12px}
.top nav{margin-left:auto;display:flex;gap:26px;align-items:center}
.top nav a{color:#fff;opacity:.95;font-weight:500}
.top .userbox{display:flex;align-items:center;gap:10px;padding-left:18px;border-left:1px solid rgba(255,255,255,.25);font-size:13px}
.top .userbox .who b{display:block;font-size:13px}
.top .userbox .who small{opacity:.8;font-size:11.5px}
.top .userbox button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.top .userbox button:hover{background:rgba(255,255,255,.12)}
.hero{background:radial-gradient(1200px 300px at 50% -40%,#d8232a,transparent),linear-gradient(180deg,#a10f16,#7a0a10);color:#fff;text-align:center;padding:40px 20px 34px}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;font-size:34px;margin:0 0 26px}
.hero .cols{display:flex;justify-content:center;gap:38px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.hero .col{flex:1;min-width:300px}
.hero h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:0 0 14px}
.sbox{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:8px;height:50px;padding:0 16px;max-width:100%}
.sbox input{flex:1;background:transparent;border:0;color:#fff;font-size:16px;outline:none}
.sbox input::placeholder{color:rgba(255,255,255,.85)}
.adv{margin-top:20px;display:inline-flex;gap:8px;align-items:center;color:#fff;font-weight:600;cursor:pointer}
/* kërkimi i avancuar */
.aswrap{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;padding:16px 22px}
@media(max-width:900px){.aswrap{grid-template-columns:1fr;padding:12px}}
.ascard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 18px 14px;position:sticky;top:12px}
.ascard h2{margin:0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:17px}
.assec{font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;font-weight:700;margin:15px 0 6px}
.ascard .fld input,.ascard .fld select{height:36px}
.asck{display:flex;align-items:center;gap:9px;padding:6px 0;font-weight:600;cursor:pointer}
.asck input{width:16px;height:16px;accent-color:var(--red);cursor:pointer;flex:none}
.asdates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asbtns{display:flex;gap:10px;margin-top:20px}
.asbtns .btn{margin:0;flex:1;padding:11px 8px}

/* layout */
.wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:22px;max-width:1500px;margin:-26px auto 0;position:relative}
.side{background:#fff;border-radius:10px;overflow:hidden;align-self:start;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side .sh{padding:18px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.side .sec{padding:14px 20px 6px;font-size:11px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.side a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--ink);font-weight:500;border-left:3px solid transparent}
.side a:hover{background:#faf5f5;text-decoration:none}
.side a.on{background:#fdeeee;color:var(--red);border-left-color:var(--red)}
.side a .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
.side a.on .n{background:#fff;color:var(--red)}
.ico{width:18px;height:18px;flex:none;color:var(--red)}
.main{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0}
.crumbs{padding:16px 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.crumbs span.sep{opacity:.5}

/* list */
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar h2{margin:0;font-size:20px;font-weight:700;flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.pill.on{background:var(--red);color:#fff;border-color:var(--red)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:10px 22px;border-bottom:1px solid var(--line);background:#fbfbfc}
.tbl td{padding:14px 22px;border-bottom:1px solid #f0f0f3;vertical-align:middle}
.tbl tr:hover td{background:#fff9f9}
.tbl .t{font-weight:600}
.tbl .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;background:#eef0f4;color:#3a3f4b;white-space:nowrap}
.tag.open{background:var(--warnbg);color:var(--warn)}
.tag.closed{background:var(--okbg);color:var(--ok)}
.tag.late{background:var(--badbg);color:var(--bad)}
.tag.in{background:#e8f0fe;color:#1a4fb4}.tag.out{background:#f3e8ff;color:#6b21a8}
.empty{padding:50px;text-align:center;color:var(--muted)}

/* libri i protokollit */
.book{background:#fff;border:1px solid #d9dce3;box-shadow:0 10px 30px rgba(20,24,40,.08);border-radius:10px;overflow:auto;margin:18px 22px 30px}
.book .bhead{padding:22px 26px 14px;text-align:center;border-bottom:3px double #b9bfcf}
.book .bhead h2{font-size:19px;letter-spacing:.14em;color:#1c2333}
.book .bhead .bsub{color:var(--muted);font-size:12.5px;margin-top:5px;letter-spacing:.04em}
.book table{width:100%;border-collapse:collapse;min-width:1100px}
.book th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#333c52;background:#f4f5f9;border:1px solid #dfe3ec;padding:9px 10px;text-align:left;white-space:nowrap}
.book td{font-size:13px;border:1px solid #e3e6ee;padding:9px 10px;vertical-align:top}
.book tr:nth-child(even) td{background:#fafbfd}
.book tr:hover td{background:#fff9f9}
.book .proto{font-weight:700;white-space:nowrap}
.tagline{font-size:10.5px;padding:1px 8px;border-radius:999px;font-weight:700;letter-spacing:.05em}
.tagline.h{background:#e8f0fe;color:#1a4fb4}
.tagline.d{background:#f3e8ff;color:#6b21a8}
.booktools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 22px 0}
.booktabs{display:flex;gap:6px;margin-right:auto;flex-wrap:wrap}
.booktabs a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;text-decoration:none;color:#3a3f4b;background:#fff}
.booktabs a.on{background:#1c2333;color:#fff;border-color:#1c2333}
.printdate{display:none}
@page{size:A4 landscape;margin:11mm}
/* ===== Detyra 10 · forma «Protokollo një dokument» ===== */
.req{color:var(--bad);font-weight:800}
.rghero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 8px}
@media (max-width:900px){.rghero{grid-template-columns:1fr}}
.autobox{border:1.5px dashed #c9c9d4;background:#fff;border-radius:10px;padding:10px 14px}
.autobox .ab-l{font-size:10.5px;font-weight:800;letter-spacing:.9px;color:var(--muted)}
.autobox .ab-v{font-size:19px;font-weight:800;color:var(--red);margin-top:2px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.4px}
.autobox .ab-s{font-size:11.5px;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{border:1px solid #d6d6dc;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.seg label:has(input:checked){border-color:var(--red);background:#fdf1f1;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.seg input{accent-color:var(--red);margin:0}
.dupline{border:1px solid var(--line);background:#fafafa;color:var(--muted);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:6px}
.dupline a{font-weight:700}
.dupline.ok{border-color:#bfe3c8;background:var(--okbg);color:var(--ok)}
.dupline.warn{border-color:#e8c98c;background:var(--warnbg);color:var(--warn)}
.dupconf{display:flex;gap:8px;align-items:flex-start;margin-top:8px;color:var(--ink);font-weight:600;cursor:pointer}
.btnqs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btnq{border:1px solid #d6d6dc;border-radius:7px;background:#fff;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink)}
.btnq:hover{border-color:var(--red);color:var(--red)}
.switch{position:relative;display:inline-flex;gap:10px;align-items:center;cursor:pointer;font-weight:600;padding:6px 0}
.switch .sw{width:40px;height:22px;border-radius:20px;background:#d6d6dc;position:relative;transition:background .15s;flex:none}
.switch .sw::after{content:"";position:absolute;top:2.5px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.switch input:checked ~ .sw{background:var(--red)}
.switch input:checked ~ .sw::after{left:20px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.chip{border:1px solid #d6d6dc;background:#fff;border-radius:20px;padding:5px 13px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink)}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.docsrc{display:flex;gap:10px;flex-wrap:wrap}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.cambox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafafa}
.cambox video{width:100%;max-width:560px;border-radius:8px;background:#000;display:block}
.camrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pagestrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{position:relative;width:86px}
.thumb img{width:86px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#fff}
.thumb span{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}
.thumb button{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:11px;line-height:1;padding:0}
.thumb button:hover{background:var(--red2)}
.pdfchip{margin-top:12px;display:inline-flex;gap:9px;align-items:center;border:1px solid var(--line);background:#fafafa;padding:8px 13px;border-radius:8px;font-size:13px}
.pdfchip button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:800;padding:0 2px}
.sigrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#sigc{border:1.5px dashed #b9b9c6;border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;max-width:100%}
.tag.br{background:#e9f7ee;color:#1e6b3c}
.tagline.b{background:#e9f7ee;color:#1e6b3c}
@media print{
  body{background:#fff!important}
  .side,.crumbs,.footer,.booktools,.no-print{display:none!important}
  .wrap{display:block!important;padding:0!important;margin:0!important}
  .main{width:100%!important;padding:0!important}
  .book{box-shadow:none;border:1.5pt solid #333;border-radius:0;margin:0}
  .book .bhead{border-bottom:2pt solid #333}
  .book td,.book th{border-color:#999!important}
  .book tr:nth-child(even) td{background:#fff!important}
  .printdate{display:block}
}

/* document page */
.docwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0}
@media(max-width:1100px){.docwrap{grid-template-columns:1fr}.wrap{grid-template-columns:1fr}.side{display:none}}
.viewer{background:#e9e9ee;border-right:1px solid var(--line)}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f2f2f5;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.vbar .sp{flex:1}
.vbar button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:28px;cursor:pointer}
.paper{margin:22px auto;width:min(560px,92%);aspect-ratio:1/1.41;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:34px 36px;font-family:Georgia,"Times New Roman",serif;color:#222;font-size:12.5px;line-height:1.55;overflow:hidden}
.paper .hd{text-align:center;border-bottom:2px double #333;padding-bottom:10px;margin-bottom:14px}
.paper .hd b{font-size:15px;letter-spacing:.5px}
.paper .meta{display:flex;justify-content:space-between;font-size:11px;color:#444;margin-bottom:12px}
.paper p{margin:0 0 8px;text-align:justify}
.paper .ln{height:7px;background:#e6e6ea;border-radius:2px;margin:9px 0}
.info{padding:22px;background:#fff}
.info h1.qt{font-size:19px;margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line);word-break:break-word}
.vhash{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.vbelow{background:#fff;padding:18px 26px 26px;border-top:1px solid var(--line)}
.info h1{font-size:19px;margin:0 0 14px;line-height:1.3}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;margin:0 0 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;margin-bottom:10px;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.line:hover{border-color:var(--red);color:var(--red)}
.hash{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#f7f7f9;border:1px solid var(--line);border-radius:6px;padding:8px;word-break:break-all;color:#333;margin-bottom:18px}
.hl{font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.rel{list-style:none;padding:0;margin:0 0 18px;border-top:1px solid var(--line)}
.rel li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.rel .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px;flex:none}
.rel .dot.g{background:var(--ok)}
.rel .dot.o{background:#d99a00}
.rel a{font-weight:600}
.rel .sm{color:var(--muted);font-size:12.5px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;background:#fcfcfd}
.box.late{background:var(--badbg);border-color:#f2c6c6}
.stepper{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .c{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.step .c.p{background:#d99a00}
.step .c.o{background:var(--line);color:var(--muted)}
.step small{color:var(--muted);display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
.toast{position:fixed;bottom:20px;right:20px;background:#1d1d1f;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:50}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:6px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select{width:100%;height:38px;border:1px solid #d6d6dc;border-radius:8px;padding:0 10px;background:#fff}
.fld.full{grid-column:1/-1}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.radios{display:flex;gap:10px}
.radios label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #d6d6dc;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:500;margin:0}
.radios input{width:auto;height:auto;margin:0}
.radios label:has(input:checked){border-color:var(--red);background:#fdeeee;color:var(--red)}
.fbtn{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:22px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.fbtn .btn{width:auto;margin:0;padding:11px 18px}
.fbtn .ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 16px;cursor:pointer;color:var(--ink)}
.fbtn .ghost:hover{border-color:var(--red);color:var(--red)}
.fbtn .btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.bad{background:var(--badbg);color:var(--bad)}
.notice.ok{background:var(--okbg);color:var(--ok)}
.newbtn{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff !important;border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none}
.newbtn:hover{background:var(--red2);text-decoration:none}
.newbtn.dis{background:#c9c9cf;pointer-events:none}
.side a.newlink{background:var(--red);color:#fff;margin:12px 14px 6px;border-radius:8px;border-left:0;justify-content:center;font-weight:600}
.side a.newlink:hover{background:var(--red2)}
.side a.newlink.on{background:var(--red2);color:#fff;border-left:0}
@media(max-width:700px){.fgrid{grid-template-columns:1fr}}

.combo{position:relative}
.combo input{width:100%;height:38px;border:1px solid #d6d6dc;border-radius:8px;padding:0 10px;background:#fff}
.combo .menu{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #d6d6dc;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;max-height:260px;overflow:auto;display:none}
.combo .opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f1f4}
.combo .opt:hover{background:#fdeeee}
.combo .opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.combo .opt.add{color:var(--red);font-weight:600}
.combo .none{padding:9px 12px;color:var(--muted)}
.addbox{margin-top:8px;border:1px dashed var(--red);border-radius:8px;padding:12px;background:#fffafa}
.addbox .addhead{font-weight:700;color:var(--red);margin-bottom:8px;font-size:13px}
.addbox .addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addbox input{height:36px;border:1px solid #d6d6dc;border-radius:8px;padding:0 10px;width:100%;background:#fff}
.addbox .addbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.addbox .addbtns button{border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;border:1px solid var(--line);background:#fff;font-size:13px}
.addbox .addbtns .save{background:var(--red);color:#fff;border-color:var(--red)}
.addbox .err{color:var(--bad);font-size:12.5px;margin-top:6px}
.protoin{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.protoin.bad{border-color:var(--bad)!important;background:var(--badbg)}
@media(max-width:700px){.addbox .addrow{grid-template-columns:1fr}}

/* hyrja (autentikimi) */
.authbg{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 16px;background:radial-gradient(900px 420px at 50% -10%,#d8232a,transparent),linear-gradient(180deg,#a10f16,#7a0a10)}
.authcard{background:#fff;border-radius:14px;padding:32px 34px;width:min(430px,94%);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.authcard .seal{width:54px;height:54px;font-size:14px;margin:0 auto 14px;color:#fff}
.authcard h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;text-align:center;font-size:24px;margin:0 0 4px;letter-spacing:.5px}
.authcard .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.authcard label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 5px}
.authcard input{width:100%;height:44px;border:1px solid #d6d6dc;border-radius:9px;padding:0 12px;font-size:15px}
.authcard .btn{margin-top:20px;width:100%;padding:13px;font-size:15px}
.authlinks{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;flex-wrap:wrap;gap:8px}
.authnote{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
.authmsg{margin-top:14px}
.whoami{display:flex;gap:12px;align-items:center;background:#fdeeee;border:1px solid #f2c6c6;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13.5px}
.loadbox{min-height:60vh;display:grid;place-items:center;color:#fff;font-size:15px;letter-spacing:.5px}

/* ndërvarësia (në stilin e QBZ) */
.secbox{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fcfcfd;overflow:hidden}
.secbox summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;list-style:none}
.secbox summary::-webkit-details-marker{display:none}
.secbox summary .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
.secbox[open] summary{border-bottom:1px solid var(--line)}
.secbox .rel{margin:0;padding:6px 12px}
.pdfwrap{height:calc(100vh - 150px);min-height:480px;display:grid;place-items:center;background:#e9e9ee}

/* të drejtat me checkbox (Odoo/Vyapar) */
.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;margin-top:12px}
.perm{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-weight:500;margin:0}
.perm input{width:auto;height:auto;margin:0;accent-color:var(--red)}
.perm:has(input:checked){border-color:var(--ok);background:var(--okbg)}
</style>

<body>

<header class="top">
  <div class="seal">ARK</div>
  <div class="brand">Arkiva Elektronike<small>Protokolli · Dosjet · Dokumentet</small></div>
  <nav>
    <a href="#/">Kryefaqja</a>
    <a href="#/dosjet">Dosjet</a>
    <a href="#/kerkesat">Kërkesat e hapura</a>
    <a href="#/gjurmimi">Gjurmimi</a>
  </nav>
  <span class="userbox" id="userbox" style="display:none"></span>
</header>

<div id="app"><div class="loadbox" style="background:linear-gradient(180deg,#a10f16,#7a0a10)">Po ngarkohet arkiva…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ARKIVA ELEKTRONIKE · frontend i lidhur me Supabase (Modeli 1)
   Hyrja me email + fjalëkalim · aprovimi nga drejtuesi · RLS
   ============================================================ */

/* ---------- konfigurimi (vlera publike) ---------- */
const SUPABASE_URL  = "https://ymetytjelrawsahpdisn.supabase.co";
const SUPABASE_KEY  = "sb_publishable_76Yg9E29YBCbrGeQeHzcYw_gIk55qIB";
const SITE_URL      = "https://genilufra-droid.github.io/arkiva/";

let sb = null;
try{
  if(typeof supabase === "undefined") throw new Error("Libraria supabase-js nuk u ngarkua (kontrollo internetin).");
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ flowType:"implicit", persistSession:true, detectSessionInUrl:true, autoRefreshToken:true }
  });
}catch(e){
  document.getElementById("app").innerHTML =
    `<div class="authbg"><div class="authcard"><h1>ARKIVA ELEKTRONIKE</h1>
     <p class="sub">Protokolli · Dosjet · Dokumentet</p>
     <div class="notice bad authmsg">${String(e.message||e).replace(/[<>]/g,"")}</div>
     <p class="authnote">Rifreskoni faqen pasi të rikthehet lidhja me internetin.</p></div></div>`;
}

/* ---------- gjendja ---------- */
const S = { session:null, profile:null, enteredFor:null, data:{cases:[],docs:[],log:[],contracts:[]} };

/* ---------- ndihmës ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const caseOf  = id => S.data.cases.find(c=>c.id===id);
const docById = id => S.data.docs.find(d=>d.id===id);
const docsOf  = cid => S.data.docs.filter(d=>d.case===cid && !d.deleted);
const docsOfAll = cid => S.data.docs.filter(d=>d.case===cid);
const REPLY_TO  = {};   /* replyDocId -> requestId  */
const REPLY_DOC = {};   /* requestId  -> replyDocId */
const reqOpen = d => d.kind==="kërkesë" && !REPLY_DOC[d.id];
const today0 = () => new Date(new Date().toDateString());
function parseDate(s){const [dd,mm,yy]=s.split("/").map(Number);return new Date(yy,mm-1,dd);}
const isLate = d => d.due && reqOpen(d) && parseDate(d.due) < today0();
const fmtD  = iso => { if(!iso) return "—"; const [d] = String(iso).split("T"); const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const fmtDT = iso => { if(!iso) return ""; const [d,t]=String(iso).split("T"); const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y} ${String(t||"").slice(0,5)}`; };
const kb = b => (b==null) ? "—" : `${Math.max(1,Math.round(b/1024))} KB`;
const base = p => p ? String(p).split("/").pop() : "—";

const ico = {
  home:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  folder:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>',
  book:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/></svg>',
  alert:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22zm1 15h-2v2h2zm0-7h-2v5h2z"/></svg>',
  users:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1a4.1 4.1 0 0 1 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>',
  dlb:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>',
  dl:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5zm7-18v12l4-4 1.4 1.4L12 18l-5.4-5.6L8 11l4 4V2z"/></svg>'
};
const toast = m => { const t=$("#toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2600); };

const ACT_LABEL = {
  dosje_krijuar:"Dosje e krijuar", dosje_riemertuar:"Dosje e riemërtuar", vendndodhja_ndryshuar:"Vendndodhja u ndryshua",
  dosje_fshire:"Dosje e fshirë", dokument_ngarkuar:"Dokument i ngarkuar", dokument_riemertuar:"Dokument i riemërtuar",
  dokument_larguar:"Dokument i larguar", dokument_shtuar:"Dokument i shtuar", dokument_fshire:"Dokument i fshirë",
  dokument_rikthyer:"Dokument i rikthyer", dosje_hapur:"Dosje e hapur", dosje_mbyllur:"Dosje e mbyllur",
  dosje_rihapur:"Dosje e rihapur", dokument_regjistruar:"Dokument i regjistruar", lidhje_shtuar:"Lidhje e shtuar",
  kontrata_krijuar:"Kontratë e krijuar", kontrata_ndryshuar:"Kontratë e ndryshuar", kontrata_fshire:"Kontratë e fshirë",
  kontrata_rikthyer:"Kontratë e rikthyer", kontrata_skedar:"Skedar kontrate", pagesa_shtuar:"Pagesë e shtuar",
  pagesa_paguar:"Pagesë e shënuar paguar", pagesa_hapur:"Pagesë e hapur", pagesa_ndryshuar:"Pagesë e ndryshuar",
  pagesa_fshire:"Pagesë e fshirë"
};
const AUTH_ERR = {
  "Invalid login credentials":"Kredenciale të pasakta — kontrolloni email-in dhe fjalëkalimin.",
  "Email not confirmed":"Email-i nuk është konfirmuar. Hapni inbox-in dhe klikoni linkun e konfirmimit.",
  "User already registered":"Ky email është i regjistruar tashmë. Provoni të hyni.",
  "Signups not allowed for this instance":"Regjistrimi është i çaktivizuar."
};
const authErrText = m => AUTH_ERR[m] || m;

/* ---------- të drejtat me check box (Odoo/Vyapar-style) ---------- */
const PERM_LABELS = {
  gjurmimi:"Gjurmimi i ndryshimeve", regjistro:"Regjistron dokumente", ndrysho:"Ndryshon dokumente",
  fshi:"Fshin / rikthen dokumente", mbyll:"Mbyll / rihap dosje", shkarko:"Hap / shkarkon skedarë",
  perdoruesit:"Menaxhon përdoruesit", backup:"Shkarkon backup"
};
const ROLE_PRESETS = {
  admin:  { gjurmimi:true, regjistro:true, ndrysho:true, fshi:true, mbyll:true, shkarko:true, perdoruesit:true, backup:true },
  editor: { gjurmimi:true, regjistro:true, ndrysho:true, fshi:true, mbyll:true, shkarko:true },
  viewer: { shkarko:true }
};
const can = p => !!(S.profile && S.profile.perms && S.profile.perms[p]);

/* ---------- ngarkimi i të dhënave nga Supabase ---------- */
function mapCase(r){ return {
  id:r.id, no:r.case_no||"—", title:r.title||"", subject:r.subject||"", loc:r.physical_location||"",
  status:r.status||"hapur", opened:fmtD(r.opened_at), closed:fmtD(r.closed_at), closeNote:r.closure_note||""
};}
function mapDoc(r){ return {
  id:r.id, case:r.case_id, dir:r.direction||"hyrje", kind:r.kind||"dokument", proto:r.protocol_no||"—",
  date:fmtD(r.doc_date), from:r.from_to||"", subject:r.subject||"", due:r.due_date?fmtD(r.due_date):"",
  size:kb(r.size_bytes), file:base(r.storage_path), sha:r.sha256||"", ocr:r.ocr_text||"", path:r.storage_path||null,
  docNo:r.doc_no||"", rem:r.remarks||"", regTs:r.created_at||"", mime:r.mime||"", deleted:!!r.deleted_at, idx:0,
  ch:r.channel||"", sref:r.sender_ref||"", conf:!!r.confidential, ret:r.retention_class||"", ploc:r.physical_location||"", labels:r.labels||"", inote:r.internal_note||""
};}
async function refresh(){
  const [cs,co,li,lg,kt] = await Promise.all([
    sb.from("cases").select("*").order("opened_at",{ascending:false}),
    sb.from("correspondence").select("*").order("doc_date",{ascending:true}).order("created_at",{ascending:true}),
    sb.from("correspondence_links").select("from_id,to_id,relation"),
    sb.from("activity_log").select("*").order("id",{ascending:false}).limit(300),
    sb.from("contracts").select("*,payments:contract_payments(*)").order("created_at",{ascending:false})
  ]);
  const bad = [cs,co,li,lg,kt].find(r=>r.error);
  if(bad){ toast("Gabim në ngarkim: "+bad.error.message); return; }
  S.data.cases = cs.data.map(mapCase);
  S.data.docs  = co.data.map(mapDoc);
  S.data.links = li.data;
  S.data.contracts = kt.data.map(mapContract);
  S.data.log   = lg.data.map(r=>({ ts:fmtDT(r.ts), user:r.user_name||"—", act:ACT_LABEL[r.action]||r.action,
    doc:(r.document_id && (docById(r.document_id)||{}).proto) || (r.contract_id && (kontrataById(r.contract_id)||{}).no) || "—", detail:r.detail||"", dref:r.document_id||null, cref:r.contract_id||null }));
  /* indeksi i dokumentit brenda dosjes: #1, #2, #3… sipas rendit kronologjik */
  const per={};
  S.data.docs.forEach(d=>{ if(d.deleted) return; (per[d.case]=per[d.case]||[]).push(d); });
  Object.values(per).forEach(arr=>arr.forEach((d,i)=>{ d.idx=i+1; }));
  Object.keys(REPLY_TO).forEach(k=>delete REPLY_TO[k]);
  Object.keys(REPLY_DOC).forEach(k=>delete REPLY_DOC[k]);
  li.data.forEach(l=>{
    if(l.relation!=="pergjigje_per") return;
    const reply=S.data.docs.find(d=>d.id===l.from_id);
    if(!reply || reply.deleted) return;      /* përgjigja e fshirë nuk mbyll kërkesën */
    REPLY_TO[l.from_id]=l.to_id; REPLY_DOC[l.to_id]=l.from_id;
  });
  updateUserbox();
}
function updateUserbox(){
  const u=$("#userbox"); if(!S.profile){u.style.display="none";return;}
  const role = S.profile.role==="admin"?"drejtues":S.profile.role==="editor"?"regjistrues":"lexues";
  u.style.display="flex";
  u.innerHTML = `<span id="livedot" title="Sinkronizim live me serverin (Realtime)" style="width:9px;height:9px;border-radius:50%;background:#4ade80;opacity:.35;transition:opacity .4s;box-shadow:0 0 6px #4ade80"></span>
    <span class="who"><b>${esc(S.profile.full_name||"përdorues")}</b><small>${role}</small></span>
    <button onclick="doSignOut()">Dil</button>`;
}
async function doSignOut(){ await sb.auth.signOut(); }

/* ============================================================
   HYRJA · REGJISTRIMI · RIKTHIMI I FJALËKALIMIT
   ============================================================ */
function renderAuth(mode, msg){
  const app=$("#app");
  const msgHtml = m => m?`<div class="notice ${m.ok?"ok":(m.warn?"warn":"bad")} authmsg">${esc(m.t)}</div>`:"";
  if(mode==="in"){
    app.innerHTML = `<div class="authbg"><div class="authcard">
      <div class="seal">ARK</div>
      <h1>ARKIVA ELEKTRONIKE</h1>
      <p class="sub">Protokolli · Dosjet · Dokumentet</p>
      ${msgHtml(msg)}
      <form onsubmit="doLogin(event)">
        <label>Email-i</label><input name="email" type="email" required autocomplete="username" placeholder="ju@shembull.com">
        <label>Fjalëkalimi</label><input name="pass" type="password" required autocomplete="current-password" placeholder="••••••••">
        <button class="btn red" type="submit">Hyr në arkivë</button>
      </form>
      <div class="authlinks"><a href="javascript:void 0" onclick="renderAuth('up')">Regjistrohu</a>
        <a href="javascript:void 0" onclick="renderAuth('forgot')">Keni harruar fjalëkalimin?</a></div>
    </div></div>`;
  }else if(mode==="up"){
    app.innerHTML = `<div class="authbg"><div class="authcard">
      <div class="seal">ARK</div>
      <h1>REGJISTRIMI</h1>
      <p class="sub">Krijo llogari të re në arkivë</p>
      ${msgHtml(msg)}
      <form onsubmit="doSignUp(event)">
        <label>Emri i plotë</label><input name="name" required placeholder="Emër Mbiemër">
        <label>Email-i</label><input name="email" type="email" required autocomplete="username" placeholder="ju@shembull.com">
        <label>Fjalëkalimi (min. 6 karaktere)</label><input name="pass" type="password" required minlength="6" autocomplete="new-password">
        <button class="btn red" type="submit">Regjistrohu</button>
      </form>
      <div class="authlinks"><a href="javascript:void 0" onclick="renderAuth('in')">← Kthehu te hyrja</a></div>
    </div></div>`;
  }else if(mode==="forgot"){
    app.innerHTML = `<div class="authbg"><div class="authcard">
      <div class="seal">ARK</div>
      <h1>RIKTHIMI I FJALËKALIMIT</h1>
      <p class="sub">Do t'ju dërgohet një link për të vendosur fjalëkalim të ri</p>
      ${msgHtml(msg)}
      <form onsubmit="doForgot(event)">
        <label>Email-i</label><input name="email" type="email" required placeholder="ju@shembull.com">
        <button class="btn red" type="submit">Dërgo linkun e rikthimit</button>
      </form>
      <div class="authlinks"><a href="javascript:void 0" onclick="renderAuth('in')">← Kthehu te hyrja</a></div>
    </div></div>`;
  }else if(mode==="newpass"){
    app.innerHTML = `<div class="authbg"><div class="authcard">
      <div class="seal">ARK</div>
      <h1>FJALËKALIM I RI</h1>
      <p class="sub">Vendosni fjalëkalimin e ri për llogarinë tuaj</p>
      ${msgHtml(msg)}
      <form onsubmit="doNewPass(event)">
        <label>Fjalëkalimi i ri (min. 6 karaktere)</label><input name="p1" type="password" required minlength="6" autocomplete="new-password">
        <label>Përsërit fjalëkalimin</label><input name="p2" type="password" required autocomplete="new-password">
        <button class="btn red" type="submit">Ruaj fjalëkalimin</button>
      </form>
      <div class="whoami" style="margin-top:16px"><span class="tag in">${esc(S.session?.user?.email||"")}</span></div>
      <div class="authlinks"><a href="javascript:void 0" onclick="skipNewPass()">Hyr në arkivë pa e ndryshuar fjalëkalimin →</a></div>
    </div></div>`;
  }else if(mode==="pending"){
    app.innerHTML = `<div class="authbg"><div class="authcard">
      <div class="seal">ARK</div>
      <h1>PRIT MIRATIMIN</h1>
      <p class="sub">Llogaria u krijua me sukses</p>
      <div class="whoami"><span class="tag in">${esc(S.session?.user?.email||"")}</span></div>
      <button class="btn red" onclick="doSignOut()">Dil</button>
    </div></div>`;
  }
}
async function doLogin(e){
  e.preventDefault();
  const f=e.target;
  const {error} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.pass.value});
  if(error) renderAuth("in",{t:authErrText(error.message)});
}
async function doSignUp(e){
  e.preventDefault();
  const f=e.target;
  const {data,error} = await sb.auth.signUp({
    email:f.email.value.trim(), password:f.pass.value,
    options:{ data:{ full_name:f.name.value.trim() } }
  });
  if(error) return renderAuth("up",{t:authErrText(error.message)});
  if(!data.session) renderAuth("in",{ok:true,t:"Regjistruar me sukses."});
}
async function doForgot(e){
  e.preventDefault();
  const f=e.target;
  const {error} = await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:SITE_URL+"?reset=1"});
  if(error) return renderAuth("forgot",{t:authErrText(error.message)});
  renderAuth("forgot",{ok:true,t:"Nëse email-i ekziston, linku i rikthimit u dërgua. Kontrollo inbox-in (edhe Spam)."});
}
async function doNewPass(e){
  e.preventDefault();
  const f=e.target;
  if(f.p1.value!==f.p2.value) return renderAuth("newpass",{t:"Fjalëkalimet nuk përputhen."});
  const {error} = await sb.auth.updateUser({password:f.p1.value});
  if(error) return renderAuth("newpass",{t:authErrText(error.message)});
  toast("Fjalëkalimi u ruajt!");
  S.pendingRecovery=false; S.enteredFor=null; await maybeEnter();
}
function skipNewPass(){ S.pendingRecovery=false; S.enteredFor=null; maybeEnter(); }

/* ---------- nisja & roja e sesionit ---------- */
async function maybeEnter(){
  if(!S.session){ renderAuth("in"); return; }
  if(S.enteredFor===S.session.user.id) return;
  if(S.pendingRecovery){ renderAuth("newpass"); return; }   /* linku i rikthimit klikuar — mbetet këtu deri të ruhet fjalëkalimi */
  const {data:prof,error} = await sb.from("profiles").select("*").eq("id",S.session.user.id).maybeSingle();
  if(error){
    if(/row-level security|permission/i.test(error.message)){ renderAuth("pending"); return; }
    renderAuth("in",{t:"Gabim: "+error.message}); await sb.auth.signOut(); return;
  }
  if(!prof || !prof.active){ S.profile=prof||null; renderAuth("pending"); return; }
  S.profile=prof; S.enteredFor=S.session.user.id;
  $("#app").innerHTML=`<div class="loadbox" style="background:var(--bg);color:var(--muted)">Po ngarkohen të dhënat…</div>`;
  await refresh();
  liveStart();
  route();
}
function cleanUrl(){
  if(/type=recovery/.test(location.search+location.hash)) S.pendingRecovery=true;
  if(/[?&]reset=1/.test(location.search)) S.pendingRecovery=true;   /* markeri ynë deterministik në redirect */
  if(location.search && /code=|token=|error=|type=|reset=/.test(location.search)) history.replaceState(null,"",location.pathname+location.hash);   /* RUAJ hash-in: token-at i lexon ende biblioteka */
}

async function boot(){
  cleanUrl();
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==="PASSWORD_RECOVERY"){ S.session=sess; S.pendingRecovery=true; history.replaceState(null,"",location.pathname+"#/"); renderAuth("newpass"); return; }
    if(ev==="SIGNED_OUT"){ S.session=null; S.profile=null; S.enteredFor=null; S.pendingRecovery=false; liveStop(); updateUserbox(); renderAuth("in"); return; }
    if(sess && S.session?.user?.id!==sess.user.id){ S.session=sess; S.enteredFor=null; }
    else if(sess){ S.session=sess; }
    if(sess) maybeEnter();
  });
  const {data:{session}} = await sb.auth.getSession();
  S.session=session;
  if(!session) renderAuth("in"); else await maybeEnter();
}

/* ---------- kërkimi i avancuar ---------- */
function applySearch(e){
  e.preventDefault();
  const f=e.target, p=new URLSearchParams();
  if(!f.querySelectorAll('input[name=ku]:checked').length){ toast("Zgjidhni ku të kërkohet: Dosjet, Dokumentet ose Kontratat."); return; }
  [...f.querySelectorAll('input[name=ku]:checked')].forEach(x=>p.append("ku",x.value));
  if(f.fjale.value.trim()) p.set("fjale",f.fjale.value.trim());
  if(f.lenda.value.trim()) p.set("lenda",f.lenda.value.trim());
  if(f.lloji.value) p.set("lloji",f.lloji.value);
  if(f.nga.value) p.set("nga",f.nga.value);
  if(f.deri.value) p.set("deri",f.deri.value);
  location.hash = "#/kerko"+(p.toString()?"?"+p.toString():"");
}
function searchPage(params){
  const kuRaw = params.getAll("ku");
  const ku = kuRaw.length ? kuRaw : ["dosje","dok","kon"];
  const fj = (params.get("fjale")||"").trim().toLowerCase();
  const te = (params.get("lenda")||"").trim().toLowerCase();
  const ll = params.get("lloji")||"";
  const llDir = ll==="hyrje"||ll==="dalje";
  const nga = params.get("nga")||"", deri = params.get("deri")||"";
  const fjWords = fj ? fj.split(/\s+/).filter(Boolean) : [];
  const hasCriteria = fjWords.length>0 || !!te || !!ll || !!nga || !!deri;
  const dnum = s => { if(!s) return null; let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); if(m) return +(m[1]+m[2]+m[3]);
    m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s)); return m? +(m[3]+m[2]+m[1]) : null; };
  const nNga=dnum(nga), nDeri=dnum(deri), hasRange = nNga!=null||nDeri!=null;
  const inRange = s => { const n=dnum(s); if(n==null) return false;
    if(nNga!=null&&n<nNga) return false; if(nDeri!=null&&n>nDeri) return false; return true; };
  const hit = (hay,ws) => ws.every(w=>hay.includes(w));

  let dos=[], dok=[], kon=[];
  if(ku.includes("dosje")) dos = S.data.cases.filter(c=>{
    const ds=docsOf(c.id);
    if(ll){ if(llDir){ if(!ds.some(x=>x.dir===ll)) return false; } else if(!ds.some(x=>x.kind===ll)) return false; }
    const cHay=(c.title+" "+c.no+" "+c.subject+" "+c.loc).toLowerCase();
    const dHay=ds.map(x=>x.proto+" "+x.subject+" "+x.from).join(" ; ").toLowerCase();
    if(te && !(cHay+" "+dHay).includes(te)) return false;
    if(fjWords.length && !hit(cHay+" "+dHay+" "+ds.map(x=>x.ocr||"").join(" ; ").toLowerCase(), fjWords)) return false;
    if(hasRange && !ds.some(x=>inRange(x.date))) return false;
    return true;
  });
  if(ku.includes("dok")) dok = S.data.docs.filter(d=>{
    if(d.deleted) return false;
    if(ll){ if(llDir){ if(d.dir!==ll) return false; } else if(d.kind!==ll) return false; }
    if(te && !((d.proto+" "+d.subject+" "+d.from).toLowerCase().includes(te))) return false;
    if(fjWords.length && !hit((d.proto+" "+d.subject+" "+d.from+" "+(d.ocr||"")).toLowerCase(), fjWords)) return false;
    if(hasRange && !inRange(d.date)) return false;
    return true;
  }).sort((a,b)=>(dnum(b.date)||0)-(dnum(a.date)||0));
  if(ku.includes("kon")) kon = S.data.contracts.filter(k=>{
    if(k.deleted) return false;
    const hay=(k.no+" "+k.title+" "+k.party+" "+(k.notes||"")).toLowerCase();
    if(te && !hay.includes(te)) return false;
    if(fjWords.length && !hit(hay,fjWords)) return false;
    if(hasRange && !inRange(k.start)) return false;
    return true;
  });

  const CAP=100, more=n=>n>CAP?`<div class="empty" style="padding:8px 14px">… edhe ${n-CAP} të tjera — konkretizo kërkimin.</div>`:"";
  let res="";
  if(!ku.length) res = `<div class="empty">Zgjidhni ku të kërkohet: Dosjet, Dokumentet ose Kontratat.</div>`;
  else{
    if(ku.includes("dosje")) res += `<div class="toolbar"><h2>Dosjet (${dos.length})</h2></div>${caseTable(dos.slice(0,CAP))}${more(dos.length)}`;
    if(ku.includes("dok")) res += `<div class="toolbar"><h2>Dokumentet (${dok.length})</h2></div>` +
      (dok.length? `<table class="tbl"><thead><tr><th>Protokolli</th><th>Lloji</th><th>Lënda</th><th>Dosja</th><th>Data</th></tr></thead><tbody>
      ${dok.slice(0,CAP).map(d=>{const c=caseOf(d.case)||{};return `<tr><td><a href="#/dokument/${d.id}" class="t">${esc(d.proto)}</a><div class="sub">#${d.idx||"—"} në dosje</div></td>
        <td><span class="tag ${d.dir==="hyrje"?"in":d.dir==="brendshme"?"br":"out"}">${d.dir==="hyrje"?"Hyrje":d.dir==="brendshme"?"Brendshme":"Dalje"}</span><div class="sub">${esc(d.kind)}</div></td>
        <td>${esc(d.subject)}<div class="sub">${esc(d.from)}</div></td>
        <td>${esc(c.no||"—")}</td><td>${d.date}</td></tr>`;}).join("")}</tbody></table>`
        :`<div class="empty">Asnjë dokument nuk përputhet me kërkimin.</div>`)+more(dok.length);
    if(ku.includes("kon")) res += `<div class="toolbar"><h2>Kontratat (${kon.length})</h2></div>${contractTable(kon.slice(0,CAP))}${more(kon.length)}`;
    if(hasCriteria && !dos.length && !dok.length && !kon.length)
      res = `<div class="empty" style="margin:0 0 8px">Asnjë rezultat për këto kritere — provo të zgjerosësh kërkimin.</div>`+res;
  }

  const ck=v=>ku.includes(v)?"checked":"";
  shellRender("kerko",[{t:"Arkiva",h:"#/"},{t:"Kërkim i avancuar"}],
  `<div class="aswrap">
    <form id="srcf" class="ascard" onsubmit="applySearch(event)">
      <h2>Kërko në arkivë</h2>
      <div class="assec">Ku të kërkohet</div>
      <label class="asck"><input type="checkbox" name="ku" value="dosje" ${ck("dosje")}> Dosjet</label>
      <label class="asck"><input type="checkbox" name="ku" value="dok" ${ck("dok")}> Dokumentet</label>
      <label class="asck"><input type="checkbox" name="ku" value="kon" ${ck("kon")}> Kontratat</label>
      <div class="assec">Fjalë kyçe</div>
      <div class="fld"><input name="fjale" value="${esc(params.get("fjale")||"")}" placeholder="Kërkohet në lëndë, palë dhe tekstin e skanuar" autocomplete="off"></div>
      <div class="assec">Lënda, numri ose palët</div>
      <div class="fld"><input name="lenda" value="${esc(params.get("lenda")||"")}" placeholder="p.sh. H-2026-0001, bashki…" autocomplete="off"></div>
      <div class="assec">Lloji i dokumentit</div>
      <div class="fld"><select name="lloji">
        <option value="">Të gjitha</option>
        <option value="hyrje" ${ll==="hyrje"?"selected":""}>Hyrje (H)</option>
        <option value="dalje" ${ll==="dalje"?"selected":""}>Dalje (D)</option>
        <option value="kërkesë" ${ll==="kërkesë"?"selected":""}>Kërkesë</option>
        <option value="shkresë" ${ll==="shkresë"?"selected":""}>Shkresë</option>
        <option value="përgjigje" ${ll==="përgjigje"?"selected":""}>Përgjigje</option>
        <option value="fletë" ${ll==="fletë"?"selected":""}>Fletë</option>
        <option value="kontratë" ${ll==="kontratë"?"selected":""}>Kontratë (dokument)</option>
      </select></div>
      <div class="assec">Data e dokumentit</div>
      <div class="asdates">
        <div class="fld"><label>Nga</label><input type="date" name="nga" value="${esc(nga)}"></div>
        <div class="fld"><label>Deri</label><input type="date" name="deri" value="${esc(deri)}"></div>
      </div>
      <div class="asbtns">
        <button type="button" class="btn line" onclick="document.getElementById('srcf').reset();location.hash='#/kerko'">Pastro</button>
        <button type="submit" class="btn red">Apliko</button>
      </div>
    </form>
    <div class="asres">${res}</div>
  </div>`);
}

  const canWrite = can("regjistro");

     <span class="tag ${c.status==="hapur"?"open":"closed"}">${c.status==="hapur"?"E hapur":"E mbyllur"}</span>

       ? (canWrite?`<a href="#/regjistro?case=${c.id}" class="newbtn">＋ Protokollo dokument</a>`:`<span class="newbtn dis">＋ Protokollo dokument</span>`)

    <div class="box"><div class="hl">Jeta e dosjes</div>

        <div class="step"><div class="c">✓</div><div>Dosja u hap<small>${c.opened}</small></div></div>

          <div><a href="#/dokument/${r.id}">${esc(r.proto)}</a> · kërkesë nga ${esc(r.from)}
          <small>${a?`Përgjigjur me ${esc(a.proto)} më ${a.date}`:`Pa përgjigje${r.due?` · afati ${r.due}`:""}`}</small></div></div>`).join("")}

function delDocsSection(cid){

  if(!del.length) return "";
  return `<div class="toolbar" style="border-top:1px solid var(--line)"><h2 style="color:var(--bad)">Të fshira (${del.length}) · vetëm drejtuesi i sheh</h2></div>
  <table class="tbl"><tbody>${del.map(d=>`<tr style="opacity:.6"><td><a href="#/dokument/${d.id}" class="t">${esc(d.proto)}</a></td>
    <td>${esc(d.subject)}<div class="sub">${esc(d.from)}</div></td><td>${d.date}</td>
    <td><button class="pill" onclick="restoreDoc('${d.id}')">↩ Rikthe</button></td></tr>`).join("")}</tbody></table>`;
}

async function reopenCase(id){

async function setPerm(id,k,v){
  const {data} = await sb.from("profiles").select("perms").eq("id",id).single();
  const perms = Object.assign({}, (data && data.perms) || {}); perms[k]=v;
  const {error} = await sb.from("profiles").update({perms}).eq("id",id);
  if(error) return toast(error.message);
  toast(`«${PERM_LABELS[k]}» → ${v?"AKTIVE":"çaktivizuar"}`);
  if(S.profile && S.profile.id===id){ S.profile.perms = perms; }
}
async function applyPreset(id,role){
  const perms = Object.assign({}, ROLE_PRESETS[role] || {});
  const {error} = await sb.from("profiles").update({role, perms}).eq("id",id);
  if(error) return toast(error.message);
  toast("Roli dhe të drejtat u ruajtën");
  if(S.profile && S.profile.id===id){ S.profile.role=role; S.profile.perms=perms; }
  usersPage();
}
async function setActive(id,active){
  const patch = {active};
  if(active){
    const {data} = await sb.from("profiles").select("perms").eq("id",id).single();
    if(data && (!data.perms || !Object.keys(data.perms).length))
      patch.perms = Object.assign({}, ROLE_PRESETS.viewer);   /* lexues me shkarkim, si parazgjedhje */
  }
  const {error} = await sb.from("profiles").update(patch).eq("id",id);
  if(error) return toast(error.message);
  toast(active?"Përdoruesi u aktivizua (me të drejtat bazë)":"Përdoruesi u çaktivizua");
  usersPage();
}

       <div class="pdfwrap" id="pdfbox"><span style="color:var(--muted)">Po hapet dokumenti…</span></div>`
    : `<div class="vbar"><span>pa skedar — parapamje regjistri</span><span class="sp"></span>

      <div id="paperwrap"><div class="paper" id="paper" style="zoom:1">

        <div class="meta"><span>Nga/për: ${esc(d.from)}</span><span>Lloji: ${esc(d.kind)}</span></div>
        <p><b>Lënda:</b> ${esc(d.subject)}</p>
        ${d.ocr ? esc(d.ocr).split("\n").map(p=>`<p>${p}</p>`).join("") : `<div class="ln"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:85%"></div>`}
        <div style="margin-top:30px;font-size:11px;color:#777">${esc(d.file)} · ${d.size}</div>
      </div></div>`;
  shellRender("",[{t:"Arkiva",h:"#/"},{t:"Dosjet",h:"#/dosjet"},{t:c.no,h:"#/dosje/"+c.id},{t:d.proto}],
  `<div class="docwrap">
    <div class="viewer">
      ${viewerHtml}
      <div class="vbelow">
        <div class="hl" style="text-align:center;margin-bottom:10px">PËRMBAJTJA</div>
        ${nderv.length ? nderv.map(sec=>`
        <details class="secbox" ${sec.items.length<=2?"open":""}>

        ${d.ploc?`<dt>Ruajtja fizike</dt><dd>${esc(d.ploc)}</dd>`:""}
        ${d.labels?`<dt>Etiketa</dt><dd>${d.labels.split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag br">${esc(t)}</span>`).join(" ")}</dd>`:""}
        ${d.inote?`<dt>Shënim i brendshëm</dt><dd>${esc(d.inote)}</dd>`:""}
        ${d.rem?`<dt>Vërejtje</dt><dd>${esc(d.rem)}</dd>`:""}
        <dt>Titulli</dt><dd>${esc(d.subject)}</dd>
        <dt>Lloji</dt><dd>${d.dir==="hyrje"?"Hyrje":d.dir==="brendshme"?"Brendshme":"Dalje"} · ${esc(d.kind)}</dd>

  if(d.path) embedPdf(d.id);

let zl=100; function zoom(d){ zl=Math.min(160,Math.max(60,zl+d)); $("#paper").style.zoom=zl/100; $("#zv").textContent=zl+"%"; }
async function embedPdf(id){
  const d=docById(id); const box=document.getElementById("pdfbox"); if(!d||!box||!d.path) return;
  if(!can("shkarko")){ box.innerHTML=`<span style="color:var(--muted)">S'ke të drejtën e hapjes së skedarëve.</span>`; return; }
  const {data,error} = await sb.storage.from("dokumente").createSignedUrl(d.path,3600);
  if(error || !data){ box.innerHTML=`<span style="color:var(--muted)">S'hapet: ${esc(error?.message||"gabim i panjohur")}</span>`; return; }
  if(d.mime && d.mime.startsWith("image/"))
    box.innerHTML=`<img src="${data.signedUrl}" alt="dokumenti" style="max-width:94%;max-height:94%;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:4px">`;
  else
    box.innerHTML=`<iframe src="${data.signedUrl}#toolbar=1&navpanes=0&view=FitH" style="width:100%;height:100%;border:0" title="${esc(d.proto)}"></iframe>`;
}
async function copyLink(id,btn){
  const url=`${location.origin}${location.pathname}#/dokument/${id}`;
  try{ await navigator.clipboard.writeText(url); const t=btn.textContent; btn.textContent="✓ u kopjua"; setTimeout(()=>{btn.textContent=t;},1600); }
  catch(_){ toast("Kopjo manualisht: "+url); }
}
async function downloadDoc(id,open){
  const d = docById(id);
  if(!can("shkarko")) return toast("S'ke të drejtën e hapjes/shkarkimit të skedarëve.");
  if(!d || !d.path){ toast("Ky dokument s'ka skedar të ngarkuar."); return; }
  toast("Po krijohet link-u i nënshkruar…");
  const {data,error} = await sb.storage.from("dokumente").createSignedUrl(d.path,300);
  if(error || !data){ return toast("Gabim: "+(error?.message||"s'krijuhet link-u")); }

const KINDS = ["shkresë","kërkesë","përgjigje","kontratë","fletë","dokument"];
const TODAY_ISO = () => { const x=new Date(); const p=n=>String(n).padStart(2,"0"); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };
const YEAR = () => new Date().getFullYear();
function nextNumber(prefix){
  const pre = prefix+"-"+YEAR()+"-";
  const pool = [...S.data.docs.map(d=>d.proto), ...S.data.cases.map(c=>c.no)];
  const nums = pool.filter(x=>x && x.startsWith(pre)).map(x=>+x.slice(pre.length)).filter(n=>!isNaN(n));
  return pre + String((nums.length?Math.max(...nums):0)+1).padStart(4,"0");
}
const nextProto = dir => nextNumber(dir==="hyrje"?"H":"D");
async function fileSha(file){
  if(!(crypto && crypto.subtle)) return "";
  const h = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* Kërkim me shkrim (jo dropdown). Nëse s'gjendet, shtohet aty. */
class Combo{
  constructor(id,o){
    this.id=id; this.o=o;
    this.in=document.getElementById(id+"-in"); this.val=document.getElementById(id+"-val");
    this.menu=document.getElementById(id+"-menu"); this.add=document.getElementById(id+"-add");
    this.in.addEventListener("focus",()=>this.open());
    this.in.addEventListener("input",()=>{ this.val.value=""; this.open(); this.o.onPick&&this.o.onPick(""); });
    this.in.addEventListener("blur",()=>setTimeout(()=>{this.menu.style.display="none";},150));
    this.in.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const f=this.filtered()[0]; if(f) this.pick(f); } });
  }
  items(){ return this.o.getItems(); }
  refresh(){ if(this.val.value && !this.items().some(i=>i.value===this.val.value)){ this.val.value=""; this.in.value=""; } }
  filtered(){
    const q=this.in.value.trim().toLowerCase();
    return this.items().filter(i=>!q || (i.label+" "+(i.sub||"")).toLowerCase().includes(q)).slice(0,8);
  }
  open(){
    const items=this.filtered(), q=this.in.value.trim();
    let html = items.map((i,k)=>`<div class="opt" data-k="${k}"><b>${esc(i.label)}</b>${i.sub?`<small>${esc(i.sub)}</small>`:""}</div>`).join("");
    if(!items.length) html += `<div class="none">Asnjë rezultat${q?` për «${esc(q)}»`:""}</div>`;
    if(this.o.onAdd) html += `<div class="opt add" data-add="1">＋ Shto ${esc(this.o.addText||"të re")}${q?` «${esc(q)}»`:""}</div>`;
    this.menu.innerHTML = html; this.menu.style.display="block";
    this.menu.querySelectorAll(".opt[data-k]").forEach(el=>el.onmousedown=e=>{ e.preventDefault(); this.pick(items[+el.dataset.k]); });
    const a=this.menu.querySelector("[data-add]");
    if(a) a.onmousedown=e=>{ e.preventDefault(); this.menu.style.display="none"; this.showAdd(q); };
  }
  pick(it){ this.val.value=it.value; this.in.value=it.label; this.menu.style.display="none"; this.add.style.display="none"; this.o.onPick&&this.o.onPick(it.value); }
  set(value){ const it=this.items().find(i=>i.value===value); this.val.value=it?value:""; this.in.value=it?it.label:""; }
  showAdd(q){
    this.add.style.display="block";
    this.add.innerHTML = `<div class="addhead">${esc(this.o.addText||"të re")}</div>${this.o.addForm(q)}
      <div class="err"></div>
      <div class="addbtns"><button type="button" class="cancel">Anulo</button><button type="button" class="save">Ruaj dhe zgjidhe</button></div>`;
    this.add.querySelector(".cancel").onclick=()=>{ this.add.style.display="none"; };
    this.add.querySelector(".save").onclick=async()=>{
      const r = await this.o.onSave(this.add);
      if(typeof r==="string"){ this.add.querySelector(".err").textContent=r; return; }
      this.add.style.display="none";
      this.val.value=r.value; this.in.value=r.label;
      this.o.onPick&&this.o.onPick(r.value);
      toast(`U shtua: ${r.label}`);
    };
    const first=this.add.querySelector("input"); if(first) first.focus();
  }
}

let RGST = { photos:[], pdf:null, pdfName:"", sigDirty:false, cam:null, dupT:null };
function rgReset(){
  if(RGST){ (RGST.photos||[]).forEach(p=>URL.revokeObjectURL(p.url)); if(RGST.cam) RGST.cam.getTracks().forEach(t=>t.stop()); }

const RG_ADD_DAYS = n => { const x=new Date(); x.setDate(x.getDate()+n); const p=v=>String(v).padStart(2,"0"); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };
let _pdlp = null;
function ensurePDFLib(){
  if(window.PDFLib) return Promise.resolve(true);
  if(_pdlp) return _pdlp;
  const srcs = ["pdf-lib.min.js",
    "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js",
    "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"];
  _pdlp = new Promise(res=>{
    let i=0;
    const next = () => {
      if(window.PDFLib){ res(true); return; }
      if(i>=srcs.length){ _pdlp=null; res(false); return; }
      const s=document.createElement("script");
      s.src=srcs[i++];
      s.onload=()=>{ window.PDFLib ? res(true) : next(); };
      s.onerror=next;
      document.head.appendChild(s);
    };
    next();
  });
  return _pdlp;
}

function rgSigInit(){
  const c=document.getElementById("sigc"); if(!c) return;
  const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  x.lineWidth=2.6; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#15181d";
  let dr=false;
  const pt=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener("pointerdown",e=>{ e.preventDefault(); dr=true; RGST.sigDirty=true; const p=pt(e); x.beginPath(); x.moveTo(p[0],p[1]); try{c.setPointerCapture(e.pointerId);}catch(_){} });
  c.addEventListener("pointermove",e=>{ if(!dr) return; const p=pt(e); x.lineTo(p[0],p[1]); x.stroke(); });
  const end=()=>{ dr=false; };
  c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end); c.addEventListener("pointerleave",end);
}
function rgSigClear(){
  const c=document.getElementById("sigc"); if(!c) return;
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
  RGST.sigDirty=false;
}
/* tekst i sigurt për fontet standarde WinAnsi në PDF */
const RG_W = t => String(t).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2013/g,"-").replace(/\u2014/g,"—").replace(/\u2026/g,"...").replace(/[^\x00-\xFF—·]/g,"");

/* montimi i PDF-së së vetme të vulosur: faqe PDF-je të pajisjes + foto + faqja e firmës */
async function rgBuildPdf(proto, dir, f, cs){
  const { PDFDocument, StandardFonts, rgb, degrees } = window.PDFLib;
  const out = await PDFDocument.create();
  out.setProducer("Arkiva Elektronike"); out.setCreator("Arkiva Elektronike");
  out.setTitle(proto ? `Protokoll ${proto} — ${cs.no}` : `Dokument i brendshëm — ${cs.no}`);
  const fB = await out.embedFont(StandardFonts.HelveticaBold);
  const fR = await out.embedFont(StandardFonts.Helvetica);
  const stampL1 = proto ? `NR. PROTOKOLLIT: ${proto}` : `NR. PROTOKOLLIT: I BRENDSHËM — PA NUMËR`;
  const stampL2 = RG_W(`PRANUAR: ${fmtD(new Date().toISOString())} · KANALI: ${f.channel.value||"—"}`);
  const conf = !!(f.conf && f.conf.checked);
  /* faqet totale paraprakisht (për «Fletë n/N») */
  let pdfPages=0; const srcs=[];
  if(RGST.pdf){
    const src = await PDFDocument.load(await RGST.pdf.arrayBuffer(), {ignoreEncryption:true});
    srcs.push(src); pdfPages += src.getPageCount();
  }
  const total = pdfPages + RGST.photos.length + (RGST.sigDirty?1:0);
  let pn=0;
  const stamp = pg => {
    pn++;
    const w=pg.getWidth(), h=pg.getHeight();
    const bw=262, bh=44, bx=Math.max(10, w-bw-10), by=h-bh-10;
    pg.drawRectangle({x:bx, y:by, width:bw, height:bh, borderColor:rgb(.62,.09,.11), borderWidth:1.1, color:rgb(1,.985,.98)});
    pg.drawText(stampL1, {x:bx+8, y:by+bh-16, size:9, font:fB, color:rgb(.62,.09,.11)});
    pg.drawText(stampL2, {x:bx+8, y:by+bh-28, size:7, font:fR, color:rgb(.35,.35,.38)});
    pg.drawText(`FLETË ${pn}/${total}`, {x:bx+8, y:by+bh-39, size:7, font:fR, color:rgb(.35,.35,.38)});
    if(conf) pg.drawText("KONFIDENCIALE", {x:w/2-170, y:h/2, size:52, font:fB, color:rgb(.70,.10,.12), opacity:.16, rotate:degrees(34)});
  };
  /* a · faqet e PDF-së nga pajisja */
  for(const src of srcs){
    const pages = await out.copyPages(src, src.getPageIndices());
    for(const p of pages){ const pg=out.addPage(p); stamp(pg); }
  }
  /* b · fotot (kamera ose nga pajisja) */
  const A4W=595.28, A4H=841.89;
  for(const ph of RGST.photos){
    let jb = ph.blob;
    if((jb.type||"")!=="image/jpeg"){
      const bmp = await createImageBitmap(jb);
      const cnv = document.createElement("canvas"); cnv.width=bmp.width; cnv.height=bmp.height;
      cnv.getContext("2d").drawImage(bmp,0,0);
      jb = await new Promise(r=>cnv.toBlob(r,"image/jpeg",.9));
    }
    const img = await out.embedJpg(await jb.arrayBuffer());
    const pg = out.addPage([A4W, A4H]);
    pg.drawRectangle({x:0, y:0, width:A4W, height:A4H, color:rgb(1,1,1)});
    const sc = Math.min((A4W-64)/img.width, (A4H-110)/img.height, 1.6);
    const iw=img.width*sc, ih=img.height*sc;
    pg.drawImage(img, {x:(A4W-iw)/2, y:(A4H-ih)/2-14, width:iw, height:ih});
    stamp(pg);
  }
  /* c · faqja e firmës */
  if(RGST.sigDirty){
    const pg = out.addPage([A4W, A4H]);
    pg.drawRectangle({x:0, y:0, width:A4W, height:A4H, color:rgb(1,1,1)});
    pg.drawText("DEKLARATA E PROTOKOLLIMIT", {x:A4W/2-125, y:A4H-160, size:14, font:fB, color:rgb(.18,.18,.2)});
    pg.drawText(stampL1, {x:A4W/2-125, y:A4H-192, size:10.5, font:fR, color:rgb(.62,.09,.11)});
    pg.drawText(stampL2, {x:A4W/2-125, y:A4H-210, size:9, font:fR, color:rgb(.4,.4,.43)});
    const png = await out.embedPng(document.getElementById("sigc").toDataURL("image/png"));
    pg.drawImage(png, {x:A4W/2-140, y:A4H-470, width:280, height:92});
    pg.drawText("Firma e regjistruesit", {x:A4W/2-140, y:A4H-492, size:10, font:fR, color:rgb(.3,.3,.33)});
    pg.drawText(RG_W(`Dosja: ${cs.no} · ${String(cs.title||"").slice(0,70)}`), {x:A4W/2-140, y:A4H-522, size:9, font:fR, color:rgb(.4,.4,.43)});
    pg.drawText(RG_W(`Regjistruar më ${fmtD(new Date().toISOString())} · Arkiva Elektronike`), {x:A4W/2-140, y:A4H-540, size:9, font:fR, color:rgb(.4,.4,.43)});
    stamp(pg);
  }
  const bytes = await out.save({useObjectStreams:false});
  return new Blob([bytes], {type:"application/pdf"});
}

    </div>
  </form>`);

  const f = document.getElementById("regf");

  /* drejtimi: numri lëshohet vetëm në ruajtje */
  const dirUI = () => {
    const dv = f.dir.value, yr = YEAR();
    document.getElementById("protoInfo").textContent = dv==="brendshme" ? "BRENDSHËM — PA NUMËR" : `${dv==="hyrje"?"H":"D"}-${yr}-####`;
    document.getElementById("dirHint").textContent = dv==="brendshme"
      ? "Dokumentet e brendshme s'marrin numër protokollit — regjistrohen pa numër."
      : "Numri lëshohet automatikisht në ruajtje; sekuenca mund të lëvizë nëse regjistrohet një dokument tjetër më parë.";
    document.getElementById("fromHint").textContent = dv==="hyrje" ? "Kush e dërgon dokumentin (p.sh. Ministria e Financave)" : dv==="dalje" ? "Kujt i dërgohet dokumenti (adresati)" : "Njësia ose personi i brendshëm";
  };
  f.querySelectorAll('input[name="dir"]').forEach(r=>r.addEventListener("change", dirUI));
  dirUI();

  /* afati i ruajtjes */
  const retHint = () => { document.getElementById("retHint").textContent = RET_LABEL[f.ret.value] || "klasifikimi sipas afatit të ruajtjes"; };
  f.querySelectorAll('input[name="ret"]').forEach(r=>r.addEventListener("change", retHint));
  retHint();

  /* butonat e afatit +3/+7/+15/+30 ditë */
  f.querySelectorAll(".btnq").forEach(b=>b.addEventListener("click",()=>{ document.getElementById("rgDue").value = RG_ADD_DAYS(+b.dataset.d); }));

  /* etiketat me chips */
  document.querySelectorAll("#regf .chip").forEach(c=>c.addEventListener("click",()=>{
    const inp=document.getElementById("rgTags");
    const parts = inp.value.split(",").map(s=>s.trim()).filter(Boolean);
    const i = parts.indexOf(c.dataset.t);
    if(i>=0){ parts.splice(i,1); c.classList.remove("on"); } else { parts.push(c.dataset.t); c.classList.add("on"); }
    inp.value = parts.join(", ");
  }));

  /* kontrolli i dublimit: vit + palë + objekt */
  const rgDupCheck = () => {
    const box=document.getElementById("dupBox");
    const from=f.from.value.trim().toLowerCase(), subj=f.subject.value.trim().toLowerCase();
    if(!from || !subj){
      box.className="dupline";
      box.innerHTML="Kontrolli i dublimit aktivizohet kur plotësohen korrespondenti dhe objekti.";
      return;
    }
    const yr=String(YEAR());
    const dup = S.data.docs.find(d=>!d.deleted && (d.regTs||"").startsWith(yr)
      && (d.from||"").toLowerCase()===from && (d.subject||"").toLowerCase()===subj);
    if(dup){
      box.className="dupline warn";
      box.innerHTML=`⚠ U gjet shënim i ngjashëm në regjistrin e këtij viti: <a href="#/dokument/${dup.id}"><b>${esc(dup.proto)}</b></a> · ${esc(dup.from)} — ${esc(dup.subject)}${dup.date?` (${dup.date})`:""}
        <label class="dupconf"><input type="checkbox" id="rgDupOk"> Konfirmoj se ky regjistrim është i ndryshëm / dublikatë e qëllimshme</label>`;
    } else {
      box.className="dupline ok";
      box.innerHTML="✓ Asnjë shënim i ngjashëm në regjistrin e këtij viti.";
    }
  };
  const dupDeb = () => { clearTimeout(RGST.dupT); RGST.dupT=setTimeout(rgDupCheck,300); };
  f.from.addEventListener("input", dupDeb);
  f.subject.addEventListener("input", dupDeb);

  /* kamera */
  document.getElementById("camBtn").addEventListener("click", rgCamStart);
  document.getElementById("shotBtn").addEventListener("click", rgShot);
  document.getElementById("camStop").addEventListener("click", ()=>{ rgCamStop(); document.getElementById("camBox").style.display="none"; });

  /* PDF ose foto nga pajisja */
  document.getElementById("rgFile").addEventListener("change", e => {
    const file = e.target.files[0]; if(!file) return;
    if(file.type==="application/pdf" || /\.pdf$/i.test(file.name)){
      RGST.pdf = file; RGST.pdfName = file.name;
      document.getElementById("pdfName").textContent = file.name;
      document.getElementById("pdfInfo").textContent = `· ${Math.max(1,Math.round(file.size/1024))} KB · do të vuloset me numrin e protokollit`;
      document.getElementById("pdfChip").style.display = "inline-flex";
    } else if(file.type && file.type.startsWith("image/")){
      RGST.photos.push({url:URL.createObjectURL(file), blob:file, w:0, h:0});
      rgThumbs();
    } else {
      toast("Lejohet vetëm PDF ose foto.");
    }
    e.target.value = "";
  });

  /* firma */
  rgSigInit();

  const sync = () => {
    const k = document.getElementById("kd-val").value;
    document.getElementById("dueReq").style.display = k==="kërkesë" ? "" : "none";
    document.getElementById("replyWrap").style.display = k==="përgjigje" ? "" : "none";
    const cid2 = document.getElementById("cs-val").value, cs = caseOf(cid2);
    document.getElementById("formNotice").innerHTML = cs && cs.status==="mbyllur"
      ? `<div class="notice bad">Dosja «${esc(cs.no)}» është e mbyllur. Nuk mund të regjistrohen dokumente. Rihapeni dosjen më parë (vetëm drejtuesi).</div>` : "";
    document.getElementById("saveBtn").disabled = !!(cs && cs.status==="mbyllur");
    RG_REPLY && RG_REPLY.refresh();
  };

  RG_CASE = new Combo("cs",{
    getItems:()=>S.data.cases.map(c=>({value:c.id,label:`${c.no} · ${c.title}`,sub:(c.status==="mbyllur"?"E mbyllur · ":"E hapur · ")+(c.loc||"pa vendndodhje")})),
    onAdd:true, addText:"dosje",
    addForm:q=>`<div class="addrow"><input data-f="title" value="${esc(q)}" placeholder="Titulli i dosjes"><input data-f="loc" placeholder="Vendndodhja fizike (opsionale)"></div>`,
    onSave: async box=>{
      const title=box.querySelector('[data-f="title"]').value.trim();
      if(!title) return "Shkruani titullin e dosjes.";
      const loc=box.querySelector('[data-f="loc"]').value.trim();
      const {data,error} = await sb.from("cases").insert({title, subject:"", physical_location:loc}).select().single();
      if(error) return error.message;
      await refresh();
      const c=caseOf(data.id);
      return {value:c.id,label:`${c.no} · ${c.title}`};
    },
    onPick:()=>sync()
  });

  RG_KIND = new Combo("kd",{
    getItems:()=>KINDS.map(k=>({value:k,label:k})),
    onAdd:true, addText:"lloj dokumenti",
    addForm:q=>`<div class="addrow"><input data-f="name" value="${esc(q)}" placeholder="Emri i llojit"><input disabled value="Ruhet në listë"></div>`,
    onSave: async box=>{
      const name=box.querySelector('[data-f="name"]').value.trim().toLowerCase();
      if(!name) return "Shkruani emrin e llojit.";
      if(!KINDS.includes(name)) KINDS.push(name);
      return {value:name,label:name};
    },
    onPick:()=>sync()
  });

  RG_REPLY = new Combo("rp",{
    getItems:()=>S.data.docs.filter(d=>d.case===RG_CASE.val.value && d.kind==="kërkesë" && reqOpen(d))
      .map(d=>({value:d.id,label:`${d.proto} · ${d.subject}`,sub:"Kërkesë e hapur"})),
    onPick:()=>{}
  });

  RG_CASE.set(cid);
  RG_KIND.set(KINDS.includes(kind0)?kind0:"shkresë");
  sync();
  if(reply0) RG_REPLY.set(reply0);

  ensurePDFLib();
  /* ndalo kamerën kur largohet nga formulari */
  const camWatch = () => { if(!location.hash.startsWith("#/regjistro")){ rgCamStop(); window.removeEventListener("hashchange", camWatch); } };
  window.addEventListener("hashchange", camWatch);

  f.addEventListener("submit", e => { e.preventDefault(); saveReg(f); });
}

async function saveReg(f){
  const err = t => { document.getElementById("formNotice").innerHTML = `<div class="notice bad">${t}</div>`; window.scrollTo(0,0); };
  const cs = caseOf(document.getElementById("cs-val").value);
  const kind = document.getElementById("kd-val").value;
  const from = f.from.value.trim(), subj = f.subject.value.trim();
  const hasDoc = !!(RGST.photos.length || RGST.pdf);
  /* 1 · MUNGON — grumbullo të gjitha fushat që mungojnë */
  const miss = [];
  if(!cs) miss.push("DOSJA (ZËRI)");
  if(!from) miss.push("KORRESPONDENTI");
  if(!subj) miss.push("OBJEKTI");
  if(!hasDoc) miss.push("DOKUMENTI (foto ose PDF)");
  if(miss.length) return err(`<b>MUNGON: ${miss.join(", ")}.</b> Plotësojini dhe provojeni sërish.`);
  /* 2 · rregullat e dosjes dhe llojit */
  if(cs.status==="mbyllur") return err("Dosja është e mbyllur — s'regjistrohen dokumente.");
  if(!kind) return err("Zgjidhni ose shtoni llojin e dokumentit.");
  if(kind==="kërkesë" && !f.due.value) return err("Kërkesa duhet të ketë afat përgjigjeje (përdor butonat +3/+7/+15/+30 ditë).");
  const replyTo = document.getElementById("rp-val").value;
  if(kind==="përgjigje" && !replyTo) return err("Zgjidhni kërkesën e hapur ku i përgjigjeni, ose ndryshoni llojin.");
  /* 3 · konfirmimi i dublimit */
  const dupBox=document.getElementById("dupBox");
  const dupOk=document.getElementById("rgDupOk");
  if(dupBox.className.includes("warn") && !(dupOk && dupOk.checked))
    return err("<b>KONFIRMIMI I DUBLIMIT:</b> në regjistrin e këtij viti ekziston një shënim i ngjashëm (e njëjta palë + objekt). Shënoni «Konfirmoj…» te Kontrolli i dublimit, ose ndryshoni objektin.");
  /* 4 · moduli i PDF-së */
  if(!(await ensurePDFLib())) return err("Moduli i ndërtimit të PDF-së s'u ngarkua. Kontrolloni lidhjen me internetin dhe rifreskoni faqen.");
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true; saveBtn.textContent = "Po lëshohet numri…";
  try{
    const dir = f.dir.value;
    const labels = document.getElementById("rgTags").value.split(",").map(s=>s.trim()).filter(Boolean).join(", ");
    const row = {
      case_id: cs.id, direction: dir, kind, protocol_no: null,
      doc_date: f.date.value || null, from_to: from, subject: subj,
      doc_no: f.dno.value.trim() || null, remarks: f.rem.value.trim() || null,
      due_date: kind==="kërkesë" ? (f.due.value||null) : null,
      channel: f.channel.value || null, sender_ref: f.sref.value.trim() || null,
      confidential: !!(f.conf && f.conf.checked),
      retention_class: f.ret.value || null,
      physical_location: f.phys.value.trim() || null,
      labels: labels || null, internal_note: f.inote.value.trim() || null,
      storage_path: null, mime: null, size_bytes: null, sha256: null, ocr_text: ""
    };
    const ins = await sb.from("correspondence").insert(row).select().single();
    if(ins.error) return err("Regjistrimi dështoi: "+esc(ins.error.message));
    const docId = ins.data.id, proto = ins.data.protocol_no || "";
    /* 5 · montimi + ngarkimi i PDF-së së vulosur (pas lëshimit të numrit) */
    try{
      const blob = await rgBuildPdf(proto, dir, f, cs);
      const sha = await fileSha(blob);
      const fname = `protokoll${proto?"_"+proto.replace(/[^\w\-]+/g,"-"):"_brendshem"}.pdf`;
      const path = `${cs.id}/${Date.now()}_${fname}`;
      const up = await sb.storage.from("dokumente").upload(path, blob, {contentType:"application/pdf", upsert:false});
      if(up.error) throw up.error;
      const pat = await sb.from("correspondence").update({storage_path:path, mime:"application/pdf", size_bytes:blob.size, sha256:sha}).eq("id",docId);
      if(pat.error) throw pat.error;
    }catch(e){
      await sb.from("correspondence").update({deleted_at:new Date().toISOString()}).eq("id",docId);
      return err("Numri u lëshua, por ruajtja e PDF-së dështoi ("+esc(String((e&&e.message)||e))+"). Regjistrimi u anulua dhe numri i lihet bosh — provojeni sërish.");
    }
    if(kind==="përgjigje" && replyTo){
      const lk = await sb.from("correspondence_links").insert({from_id:docId, to_id:replyTo, relation:"pergjigje_per"});
      if(lk.error) toast("Lidhja me kërkesën dështoi: "+lk.error.message);
    }
    await refresh();
    const saved = docById(docId);
    toast(`U protokollua: ${proto||"dokument i brendshëm pa numër"} · ${saved?`dokumenti #${saved.idx} i dosjes ${cs.no}`:""}`);
    rgCamStop();
    location.hash = "#/dokument/"+docId;
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = "Lësho numrin e protokollit";
  }
}
