const isoOf = ddmm => { if(!ddmm||ddmm==="—") return ""; const p=String(ddmm).split("/"); return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:""; };
function editDoc(id){
  const d=docById(id); if(!d) return notFound();
  if(!can("ndrysho")) return notFound();
  const c=caseOf(d.case)||{no:"—"};
  const kinds=[...new Set([d.kind,...KINDS])];
  shellRender("",[{t:"Arkiva",h:"#/"},{t:"Dosjet",h:"#/dosjet"},{t:c.no,h:"#/dosje/"+d.case},{t:"Ndrysho "+d.proto}],
  `<div class="toolbar"><h2>Ndrysho dokumentin ${esc(d.proto)} <span class="sub" style="font-weight:400">· dosja ${esc(c.no)} · dokumenti #${d.idx}</span></h2></div>
  <form id="editf" style="padding:0 22px 22px" novalidate>
    <div class="fgrid">
      <div class="fld full"><label>Lënda</label><input name="subject" maxlength="200" value="${esc(d.subject)}" required></div>
      <div class="fld"><label>Nga / për kë</label><input name="from" value="${esc(d.from)}"></div>
      <div class="fld"><label>Lloji</label><select name="kind">${kinds.map(k=>`<option ${k===d.kind?"selected":""}>${esc(k)}</option>`).join("")}</select></div>
      <div class="fld"><label>Data e dokumentit</label><input type="date" name="date" value="${isoOf(d.date)}"></div>
      <div class="fld"><label>Nr. i dokumentit</label><input name="dno" value="${esc(d.docNo)}" maxlength="60"></div>
      <div class="fld full"><label>Vërejtje</label><input name="rem" value="${esc(d.rem)}" maxlength="200"></div>
      <div class="fld"><label>Afati (vetëm për kërkesa)</label><input type="date" name="due" value="${d.due?isoOf(d.due):""}"></div>
      <div class="fld"><label>Kanali</label><select name="channel">${RG_CHANNELS.map(c=>`<option value="${c}" ${c===(d.ch||"")?"selected":""}>${c||"— pa kanal —"}</option>`).join("")}</select></div>
      <div class="fld"><label>Ref. e dërguesit</label><input name="sref" value="${esc(d.sref)}" maxlength="100"></div>
      <div class="fld"><label>Konfidenciale</label><label class="switch"><input type="checkbox" name="conf" ${d.conf?"checked":""}><span class="sw"></span> Fletë konfidencialiteti</label></div>
      <div class="fld"><label>Afati i ruajtjes</label><div class="seg">${["A","B","C"].map(r=>`<label><input type="radio" name="ret" value="${r}" ${r===(d.ret||"C")?"checked":""}> Klasa ${r}</label>`).join("")}</div><div class="hint">${esc(RET_LABEL[d.ret||"C"]||"")}</div></div>
      <div class="fld"><label>Ruajtja fizike</label><input name="phys" value="${esc(d.ploc)}" maxlength="120" placeholder="p.sh. Arkiv B — rafti 12"></div>
      <div class="fld"><label>Etiketa</label><input name="labels" value="${esc(d.labels)}" maxlength="120" placeholder="me presje, p.sh. urgjent, ankesë"></div>
      <div class="fld full"><label>Shënim i brendshëm</label><input name="inote" value="${esc(d.inote)}" maxlength="200"></div>
    </div>
    <div id="editNotice"></div>
    <div class="fbtn"><a class="ghost" style="text-decoration:none" href="#/dokument/${d.id}">Anulo</a>
      <button type="submit" class="btn red">Ruaj ndryshimet</button></div>
  </form>`);
  document.getElementById("editf").addEventListener("submit", async e=>{
    e.preventDefault();
    const f=e.target;
    const note=t=>{ document.getElementById("editNotice").innerHTML=`<div class="notice bad">${t}</div>`; window.scrollTo(0,0); };
    const kind=f.kind.value, subject=f.subject.value.trim(), from=f.from.value.trim();
    if(!subject) return note("Lënda është e detyrueshme.");
    if(!from) return note("Plotësoni fushën «Nga / për kë».");
    if(kind==="kërkesë" && !f.due.value) return note("Kërkesa duhet të ketë afat përgjigjeje.");
    const patch={ subject, from_to:from, kind, doc_date:f.date.value||null,
      doc_no:f.dno.value.trim()||null, remarks:f.rem.value.trim()||null,
      due_date: kind==="kërkesë" ? (f.due.value||null) : null,
      channel: f.channel.value||null, sender_ref: f.sref.value.trim()||null,
      confidential: !!(f.conf&&f.conf.checked), retention_class: f.ret.value||null,
      physical_location: f.phys.value.trim()||null, labels: f.labels.value.trim()||null,
      internal_note: f.inote.value.trim()||null };
    const {error} = await sb.from("correspondence").update(patch).eq("id",id);
    if(error) return note("Ruajtja dështoi: "+esc(error.message));
    toast("Ndryshimet u ruajtën");
    await refresh(); location.hash="#/dokument/"+id; docPage(id);
  });
}
async function deleteDoc(id){
  const d=docById(id); if(!d) return;
  if(!can("fshi")) return;
  if(!confirm(`Fshi dokumentin ${d.proto} (${d.subject})?\n\nFshihet nga pamjet normale, por mbetet në gjurmim dhe drejtuesi mund ta rikthejë. Skedari fizik NUK fshihet nga ruajtësja.`)) return;
  const {error} = await sb.from("correspondence").update({deleted_at:new Date().toISOString()}).eq("id",id);
  if(error) return toast(error.message);
  toast("Dokumenti u fshi (mbetet në gjurmim)");
  await refresh(); casePage(d.case);
}

/* ---------- LIBRI I PROTOKOLLIT: regjistri zyrtar online ---------- */
function libriPage(params){
  const dir = params.get("dir")==="hyrje"?"hyrje":params.get("dir")==="dalje"?"dalje":"";
  const q = (params.get("q")||"").trim(), ql=q.toLowerCase();
  const teGjitha = S.data.docs.filter(d=>!d.deleted);
  const nH = teGjitha.filter(d=>d.dir==="hyrje").length;
  const nD = teGjitha.filter(d=>d.dir==="dalje").length;
  let docs = teGjitha;
  if(dir) docs = docs.filter(d=>d.dir===dir);
  if(ql) docs = docs.filter(d=>{
    const c=caseOf(d.case);
    return `${d.proto} ${d.docNo} ${d.from} ${d.subject} ${d.rem} ${c?c.no+" "+c.title:""}`.toLowerCase().includes(ql);
  });
  docs = docs.slice().sort((a,b)=>String(a.regTs||"").localeCompare(String(b.regTs||"")));
  const qs = q?`&q=${encodeURIComponent(q)}`:"";
  const tab=(h,lbl,n,on)=>`<a href="${h}" class="${on?"on":""}">${lbl} <span style="opacity:.6">${n}</span></a>`;
  shellRender("libri",[{t:"Arkiva",h:"#/"},{t:"Libri i Protokollit"}],`
  <div class="booktools no-print">
    <div class="booktabs">
      ${tab("#/libri"+qs,"Të gjitha",teGjitha.length,!dir)}
      ${tab("#/libri?dir=hyrje"+qs,"Hyrje",nH,dir==="hyrje")}
      ${tab("#/libri?dir=dalje"+qs,"Dalje",nD,dir==="dalje")}
    </div>
    <form class="sbox" style="margin:0;min-width:280px;flex:1;max-width:420px" onsubmit="event.preventDefault();location.hash='#/libri?${dir?`dir=${dir}&`:""}q='+encodeURIComponent(this.q.value)">
      ${ico.search}<input name="q" value="${esc(q)}" placeholder="Kërko protokoll, palë, lëndë, dosje…" autocomplete="off">
    </form>
    ${can("regjistro")?`<button class="btn red" onclick="location.hash='#/regjistro?dir=${dir||"hyrje"}'">＋ Regjistro në libër</button>`:""}
    <button class="btn line" onclick="window.print()">🖨 Printo librin</button>
  </div>
  <div class="book">
    <div class="bhead">
      <h2>LIBRI I PROTOKOLLIT</h2>
      <div class="bsub">Regjistri elektronik i dokumenteve të hyra e të dala · Arkiva Elektronike${dir==="hyrje"?" · vetëm dokumente hyrje":dir==="dalje"?" · vetëm dokumente dalje":""}${q?` · kërkim: «${esc(q)}»`:""}</div>
      <div class="bsub printdate">Shtypur më ${fmtDT(new Date().toISOString())} · ${docs.length} regjistrime</div>
    </div>

/* ---------- kontratat: regjistrim, pagesa, kujtesa 7-ditore ---------- */
function mapContract(r){
  const pays=(r.payments||[]).map(p=>({ id:p.id, due:p.due_date, dueD:fmtD(p.due_date), amt:+p.amount,
    desc:p.description||"", paid:!!p.paid, paidD:p.paid_at?fmtD(p.paid_at):"" }))
    .sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  return { id:r.id, no:r.contract_no||"—", title:r.title||"", party:r.counterparty||"",
    start:r.start_date||"", startD:fmtD(r.start_date), end:r.end_date||"", endD:fmtD(r.end_date),
    value:r.value_num!=null?+r.value_num:null, notes:r.notes||"",
    path:r.storage_path||null, file:r.file_name||"", size:kb(r.size_bytes), mime:r.mime||"", sha:r.sha256||"",
    deleted:!!r.deleted_at, created:fmtD(r.created_at), pays };
}
const kontrataById = id => S.data.contracts.find(k=>k.id===id);
const fmtLek = n => (n==null||n==="")?"—":Number(n).toLocaleString("sq-AL")+" LEK";
function konStatusi(k){
  const t0=new Date(); t0.setHours(0,0,0,0);
  if(k.deleted) return {t:"Fshirë",cls:"late",d:null};
  if(!k.end) return {t:"Pa afat",cls:"out",d:null};
  const d=Math.round((new Date(k.end+"T00:00:00")-t0)/864e5);
  if(d<0)  return {t:"Skaduar",cls:"late",d};
  if(d<=7) return {t:"Skadon",cls:"open",d};
  return {t:"Aktive",cls:"closed",d};
}
function kujtesa7(){
  const t0=new Date(); t0.setHours(0,0,0,0);
  const pays=[];
  S.data.contracts.forEach(k=>{ if(k.deleted) return;
    k.pays.forEach(p=>{ if(p.paid) return;
      const d=Math.round((new Date(p.due+"T00:00:00")-t0)/864e5);
      if(d<=7) pays.push({k,p,d});
    });
  });
  pays.sort((a,b)=>a.p.due.localeCompare(b.p.due));
  const kontratat=S.data.contracts.filter(k=>{ if(k.deleted||!k.end) return false;
    const d=Math.round((new Date(k.end+"T00:00:00")-t0)/864e5); return d>=0&&d<=7; });
  return {pays,kontratat,n:pays.length+kontratat.length};
}
function contractsPage(params){
  const q=(params.get("q")||"").toLowerCase(), st=params.get("s"), km=params.get("k")==="1";
  const kj=kujtesa7();

  if(km) list=list.filter(k=>kj.pays.some(x=>x.k.id===k.id)||kj.kontratat.some(x=>x.id===k.id));
  else if(st==="aktive") list=list.filter(k=>{const s=konStatusi(k);return s.t==="Aktive"||s.t==="Skadon";});

     ${kj.n?`<a href="#/kontratat?k=1" class="pill ${km?"on":""}" style="background:var(--badbg);color:var(--bad)">⚠ Kujtesa (${kj.n})</a>`:""}

     <table class="tbl"><tbody>${del.map(k=>`<tr style="opacity:.6"><td><a href="#/kontrata/${k.id}" class="t">${esc(k.no)}</a></td>

       <td><button class="pill" onclick="restoreContract('${k.id}')">↩ Rikthe</button></td></tr>`).join("")}</tbody></table>`:""}`);

  if(!list.length) return `<div class="empty">Nuk ka kontrata.</div>`;

async function embedKontrata(id){

  const {data,error}=await sb.storage.from("dokumente").createSignedUrl(k.path,3600);
  if(error || !data){ box.innerHTML=`<span style="color:var(--muted)">S'hapet: ${esc(error?.message||"gabim i panjohur")}</span>`; return; }
  if(k.mime && k.mime.startsWith("image/"))
    box.innerHTML=`<img src="${data.signedUrl}" alt="kontrata" style="max-width:94%;max-height:94%;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:4px">`;
  else
    box.innerHTML=`<iframe src="${data.signedUrl}#toolbar=1&navpanes=0&view=FitH" style="width:100%;height:100%;border:0" title="${esc(k.no)}"></iframe>`;
}

async function saveContract(e,id){
  e.preventDefault();
  const f=e.target;
  const nr=f.nr.value.trim(), objekti=f.objekti.value.trim();
  if(!nr) return toast("Plotëso numrin e kontratës.");
  if(!objekti) return toast("Plotëso objektin e kontratës.");
  const btn=document.getElementById("ksave"); btn.disabled=true; btn.textContent="Po ruan…";
  try{
    if(id){
      const {error}=await sb.from("contracts").update({
        contract_no:nr, title:objekti, counterparty:f.pale.value.trim()||null,
        start_date:f.nisja.value||null, end_date:f.skadimi.value||null,
        value_num:f.vlera.value?+f.vlera.value:null, notes:f.shenime.value.trim()||null
      }).eq("id",id);
      if(error) return toast(error.message);
      toast("Kontrata u ndryshua"); await refresh(); location.hash="#/kontrata/"+id;
    } else {
      let storage_path=null,mime=null,size=null,sha=null,file_name=null;
      const file=f.skedari.files[0];
      if(file){
        const path=`kontrate/${Date.now()}_${file.name.replace(/[^\w.\-]+/g,"_")}`;
        const up=await sb.storage.from("dokumente").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
        if(up.error) return toast("Ngarkimi i skedarit dështoi: "+up.error.message);
        storage_path=path; mime=file.type||null; size=file.size; file_name=file.name; sha=await fileSha(file);
      }
      const row={ contract_no:nr, title:objekti, counterparty:f.pale.value.trim()||null,
        start_date:f.nisja.value||null, end_date:f.skadimi.value||null,
        value_num:f.vlera.value?+f.vlera.value:null, notes:f.shenime.value.trim()||null,
        storage_path, file_name, mime, size_bytes:size, sha256:sha||null, created_by:S.session?.user?.id };
      const ins=await sb.from("contracts").insert(row).select().single();
      if(ins.error) return toast(ins.error.message);
      const kid=ins.data.id;
      const dues=[...f.querySelectorAll('input[name=p_due]')], amts=[...f.querySelectorAll('input[name=p_amt]')], descs=[...f.querySelectorAll('input[name=p_desc]')];
      const rows=[]; dues.forEach((d,i)=>{ if(d.value&&amts[i].value) rows.push({contract_id:kid,due_date:d.value,amount:+amts[i].value,description:descs[i].value.trim()||null}); });
      if(rows.length){ const pe=await sb.from("contract_payments").insert(rows); if(pe.error) toast("Pagesat dështuan: "+pe.error.message); }
      await refresh();
      toast("Kontrata u regjistrua"); location.hash="#/kontrata/"+kid;
    }
  } finally { btn.disabled=false; btn.textContent=id?"Ruaj ndryshimet":"Regjistro kontratën"; }
}
async function addPayment(kid){
  const due=document.getElementById("np-due").value, amt=+document.getElementById("np-amt").value, desc=document.getElementById("np-desc").value.trim();
  if(!due||!amt) return toast("Plotëso afatin dhe shumën e pagesës.");
  const {error}=await sb.from("contract_payments").insert({contract_id:kid,due_date:due,amount:amt,description:desc||null});
  if(error) return toast(error.message);
  toast("Pagesa u shtua"); await refresh(); contractPage(kid);
}

async function uploadContractFile(id,inp){
  const f=inp.files[0]; if(!f) return;

  const up=await sb.storage.from("dokumente").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});
  if(up.error) return toast("Ngarkimi dështoi: "+up.error.message);
  const sha=await fileSha(f);
  const {error}=await sb.from("contracts").update({storage_path:path,file_name:f.name,mime:f.type||null,size_bytes:f.size,sha256:sha||null}).eq("id",id);

async function downloadContract(id){

  if(!can("shkarko")) return toast("S'ke të drejtën e shkarkimit.");
  const {data,error}=await sb.storage.from("dokumente").createSignedUrl(k.path,300);
  if(error||!data) return toast(error?.message||"Gabim në nënshkrimin e linkut.");
  const a=document.createElement("a"); a.href=data.signedUrl; a.download=k.file||"kontrata"; a.click();
}

/* ---------- backup i plotë: ZIP me të dhëna + skedarë (vetëm drejtuesi) ---------- */
async function downloadBackup(){
  if(!can("backup")) return toast("S'ke të drejtën e backup-it.");
  if(typeof JSZip==="undefined") return toast("Libraria ZIP s'u ngarkua — kontrollo internetin dhe rifresko faqen.");
  toast("Po përgatitet backup-i i plotë…");
  const tables=[["cases","*"],["correspondence","*"],["correspondence_links","*"],["activity_log","*"],
                ["contracts","*"],["contract_payments","*"],
                ["folders","*"],["documents","*"],["profiles","id,full_name,role,active,perms,created_at"]];
  const out={ project:SUPABASE_URL, site:SITE_URL, exported_at:new Date().toISOString(),
    note:"ARKIVA ELEKTRONIKE · kopje e plotë: të dhënat në këtë skedar (arkiva.json) dhe skedarët fizikë në dosjen files/ të ZIP-it. Rikthimi: butoni «Restore nga backup» në site." };
  for(const [t,cols] of tables){
    const {data,error} = await sb.from(t).select(cols);
    if(error){ toast(`Backup · ${t}: ${error.message}`); continue; }
    out[t]=data;
  }
  const paths=[];
  const listo=async pre=>{
    const {data,error}=await sb.storage.from("dokumente").list(pre||"", {limit:1000});
    if(error||!data||!data.length) return;
    for(const it of data){
      const p=pre?pre+"/"+it.name:it.name;
      if(it.id) paths.push(p); else await listo(p);
    }
  };
  await listo("");
  const zip=new JSZip();
  zip.file("arkiva.json", JSON.stringify(out,null,2));
  let nf=0;
  for(const p of paths){
    const {data,error}=await sb.storage.from("dokumente").download(p);
    if(!error&&data){ zip.file("files/"+p, data); nf++; }
  }
  const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`arkiva-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.zip`;
  a.click();
  toast(`Backup-i i plotë u shkarkua (${nf} skedarë brenda)`);
}

/* ---------- restore nga backup ZIP (me skedarë) ose JSON (vetëm të dhëna) ---------- */
const MIME_NGA_EXT={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",txt:"text/plain",csv:"text/csv"};
function restoreBackup(){
  if(!can("backup")) return toast("S'ke të drejtën e restore.");
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,.zip,application/json,application/zip";
  inp.onchange=async()=>{
    try{
      const f=inp.files[0];
      const emri=(f.name||"").toLowerCase();
      const magjia=await f.slice(0,2).text();
      let payload=null, zip=null;
      if(emri.endsWith(".zip")||magjia==="PK"){
        if(typeof JSZip==="undefined") return toast("Libraria ZIP s'u ngarkua — kontrollo internetin dhe rifresko faqen.");
        zip=await JSZip.loadAsync(f);
        const j=zip.file("arkiva.json");
        if(!j) return toast("ZIP-i s'përmban «arkiva.json» — s'është backup i Arkivës.");
        payload=JSON.parse(await j.async("string"));
      } else {
        payload=JSON.parse(await f.text());
      }
      if(!payload || !payload.note || !payload.exported_at) return toast("Skedari s'është backup i Arkivës Elektronike.");
      const N=t=>Array.isArray(payload[t])?payload[t].length:0;
      const nf=zip?Object.keys(zip.files).filter(k=>k.startsWith("files/")&&!zip.files[k].dir).length:0;
      const dataB=new Date(payload.exported_at).toLocaleString("sq-AL");
      const rreshta=`Dosje: ${N("cases")} · Dokumente: ${N("correspondence")} · Kontrata: ${N("contracts")} · Pagesa: ${N("contract_payments")} · Historik: ${N("activity_log")}${nf?` · Skedarë: ${nf}`:""}`;
      if(!confirm(`Rikthim nga backup-i i ${dataB}\n\n${rreshta}\n\nRreshtat ekzistues me të njëjtin ID përditësohen (mos dyfishohen).${nf?" Skedarët rikthehen në ruajtëse.":""} Vazhdo?`)) return;
      toast("Po rikthehen të dhënat…");
      const {error}=await sb.rpc("restore_arkiva",{payload});
      if(error) return toast("Restore: "+error.message);
      if(zip&&nf>0){
        let ok=0, gabim="";
        for(const k of Object.keys(zip.files)){
          if(!k.startsWith("files/")||zip.files[k].dir) continue;
          const p=k.slice(6);
          const ext=(p.match(/\.([a-z0-9]+)$/i)||[])[1];
          const ct=(ext&&MIME_NGA_EXT[ext.toLowerCase()])||"application/octet-stream";
          const blob=new Blob([await zip.files[k].async("arraybuffer")],{type:ct});
          const {error:e2}=await sb.storage.from("dokumente").upload(p, blob, {upsert:true, contentType:ct});
          if(!e2) ok++; else gabim=p+": "+e2.message;
        }
        toast(gabim?`Disa skedarë s'u rikthyen (${gabim})`:`Të dhënat u rikthyen nga backup-i ✓ (+${ok} skedarë)`);
      } else {
        toast("Të dhënat u rikthyen nga backup-i ✓");
      }
      await refresh(); route();
    }catch(e){ toast("Skedar i palexueshëm: "+e.message); }
  };
  inp.click();
}

/* ---------- reset i plotë (vetëm drejtuesi; backup i detyrueshëm + FSHIJ) ---------- */
function resetArkiva(){
  if(!can("perdoruesit")) return toast("Vetëm drejtuesi mund të bëjë reset të plotë.");
  let backupDone=false;
  const w=document.createElement("div");
  w.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:grid;place-items:center;padding:16px;overflow:auto";
  w.innerHTML=`<div class="authcard" style="max-width:540px;width:100%;text-align:left">
    <div class="seal">ARK</div>
    <h1 style="font-size:20px">RESET I PLOTË I ARKIVËS</h1>
    <div class="notice bad" style="margin:12px 0">⚠ Fshihen PËRGJITHMONË: të gjitha dosjet, dokumentet, lidhjet, kontratat, pagesat dhe historiku — plus skedarët e skanuar nga ruajtësja.<br><br>Mbeten: <b>përdoruesit</b> dhe numërimi i protokolleve (pa dyfishime).</div>
    <button id="rsBk" class="btn red">${ico.dl} 1. Shkarko backup-un (i detyrueshëm)</button>
    <div class="fld" style="margin-top:12px"><label>2. Shkruaj FSHIJ për të konfirmuar</label><input id="rsTxt" placeholder="FSHIJ" autocomplete="off"></div>
    <button id="rsGo" class="btn line" style="margin-top:12px;color:var(--bad);border-color:var(--bad)" disabled>⟲ Fshi gjithçka</button>
    <button id="rsNo" class="btn line" style="margin-top:6px">Anulo</button>
  </div>`;
  document.body.appendChild(w);
  w.querySelector("#rsNo").onclick=()=>w.remove();
  w.querySelector("#rsBk").onclick=async()=>{
    await downloadBackup();
    backupDone=true;
    const b=w.querySelector("#rsBk"); b.textContent="✓ Backup-u u shkarkua — ruaje në vend të sigurt"; b.disabled=true;
    w.querySelector("#rsTxt").focus();
  };
  w.querySelector("#rsTxt").oninput=e=>{ w.querySelector("#rsGo").disabled=!(backupDone && e.target.value.trim()==="FSHIJ"); };
  w.querySelector("#rsGo").onclick=async()=>{
    if(!confirm("FUNDI I RRUGËS: pas këtij hapi s'ka kthim pa backup. Vazhdo me fshirjen e plotë të arkivës?")) return;
    toast("Po rivendoset arkiva…");
    const {error}=await sb.rpc("reset_arkiva");
    if(error){ toast("Reset: "+error.message); return; }
    const nf=await pastroStorage();
    toast("Arkiva u rivendos në gjendjen fillestare"+(nf>0?` (u fshinë ${nf} skedarë)`:""));
    w.remove(); await refresh(); route();
  };
}
async function pastroStorage(){
  let bound=0;
  const fshi=async pre=>{
    const {data,error}=await sb.storage.from("dokumente").list(pre||"", {limit:1000});
    if(error||!data||!data.length) return;
    for(const it of data){
      const p = pre ? pre+"/"+it.name : it.name;
      if(it.id){ bound++; await sb.storage.from("dokumente").remove([p]); }
      else await fshi(p);
    }
  };
  try{ await fshi(""); }catch(_){}
  return bound;
}

/* ---------- sinkronizimi live (Realtime, ~1 sekondë) ---------- */
let LIVE=null, liveT=null;
function liveStart(){
  liveStop();
  LIVE = sb.channel("arkiva-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"cases"},livePing)
    .on("postgres_changes",{event:"*",schema:"public",table:"correspondence"},livePing)
    .on("postgres_changes",{event:"*",schema:"public",table:"correspondence_links"},livePing)
    .on("postgres_changes",{event:"*",schema:"public",table:"contracts"},livePing)
    .on("postgres_changes",{event:"*",schema:"public",table:"contract_payments"},livePing)
    .on("postgres_changes",{event:"*",schema:"public",table:"activity_log"},livePing)
    .subscribe();
}
function liveStop(){ if(LIVE){ try{ sb.removeChannel(LIVE); }catch(_){} LIVE=null; } clearTimeout(liveT); }
function livePing(){
  const dot=document.getElementById("livedot");
  if(dot){ dot.style.opacity="1"; setTimeout(()=>{ dot.style.opacity=".35"; },1500); }
  clearTimeout(liveT);
  liveT=setTimeout(async()=>{
    /* mos i prish format që po plotësohen */
    if(document.getElementById("regf") || document.getElementById("editf") || document.getElementById("srcf")) return;
    if(!S.session || !S.profile || !S.profile.active) return;
    await refresh();
    route();
  },500);
}

/* ---------- router ---------- */
function route(){
  if(!S.session || !S.profile || !S.profile.active) return;   /* roja e hyrjes */
  const h = location.hash||"#/";
  const [path,qs] = h.split("?");
  let params;
  try{ params = new URLSearchParams(qs||""); }catch(_){ params = new URLSearchParams(); }
  window.scrollTo(0,0);
  if(path.startsWith("#/dosje/")) return casePage(path.split("/")[2]);
  if(path.startsWith("#/dokument/")) return docPage(path.split("/")[2]);
  if(path.startsWith("#/ndrysho/")) return editDoc(path.split("/")[2]);
  if(path.startsWith("#/libri")) return libriPage(params);
  if(path.startsWith("#/dosjet")) return casesPage(params);
  if(path.startsWith("#/kerkesat")) return requestsPage(params);
  if(path.startsWith("#/kerko")) return searchPage(params);
  if(path.startsWith("#/gjurmimi")) return logPage();
  if(path.startsWith("#/regjistro")) return registerPage(params);
  if(path.startsWith("#/perdoruesit")) return usersPage();
  if(path.startsWith("#/kontrata-re")) return contractForm(null);
  if(path.startsWith("#/kontrata-ndrysho/")) return contractForm(path.split("/")[2]);
  if(path.startsWith("#/kontrata/")) return contractPage(path.split("/")[2]);
  if(path.startsWith("#/kontratat")) return contractsPage(params);
  return home();
}
window.addEventListener("hashchange",route);
if(!location.hash) location.hash="#/";

if(sb) boot();
</script>
